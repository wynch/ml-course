<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Hundred Moves</title>
<meta name="description" content="Machine learning in a hundred scroll-driven moves: one field of 420 points reshapes itself into every idea.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Self-hosted fonts shared with the research pages: no network at runtime. -->
<link rel="stylesheet" href="../research/assets/fonts.css">
<style>
/* Layout: one fixed field of 420 points; a column of short cards scrolls over it, one card per move. */
:root{
  --bg:#ECEFF3; --fg:#0F1D2B; --muted:#4B5868; --blue:#2D57CF; --gold:#B87708; --faint:#B9C2CE;
  --card:rgba(236,239,243,.84); --line:rgba(15,29,43,.12);
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --fg:#E4EAF2; --muted:#98A6B8; --blue:#7EA2FF; --gold:#F2B23E; --faint:#36435A;
  --card:rgba(10,17,28,.8); --line:rgba(228,234,242,.13); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --fg:#E4EAF2; --muted:#98A6B8; --blue:#7EA2FF; --gold:#F2B23E; --faint:#36435A;
  --card:rgba(10,17,28,.8); --line:rgba(228,234,242,.13); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#stage{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;display:block;z-index:0;touch-action:pan-y}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;gap:12px;justify-content:space-between;align-items:baseline;
  font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:linear-gradient(var(--bg) 50%,transparent)}
.hud .count{font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .count b{color:var(--fg);font-weight:500}
.hud .chap{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:4px;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;transform-origin:left center;transform:scaleX(0);background:var(--blue)}
main{position:relative;z-index:2}
.step{height:86vh;height:86svh;display:flex;align-items:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(3svh + env(safe-area-inset-bottom,0px))}
.step:last-child{height:100vh;height:100lvh}
.card{width:100%;max-width:31rem;min-width:0;background:var(--card);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
.kicker{display:flex;justify-content:space-between;gap:12px;margin:0 0 10px;
  font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.kicker span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.card h2{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:clamp(27px,7.6vw,46px);
  line-height:1.02;letter-spacing:-.025em;text-wrap:balance;font-variation-settings:'opsz' 72}
.card h2 .w{display:inline-block}
.body{margin:0;font-size:16px;line-height:1.5;color:var(--muted);max-width:60ch}
.body b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.hint{margin:14px 0 0;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.hint i{display:inline-block;width:1.5px;height:20px;background:currentColor;transform-origin:top;animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0)}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.again{margin-top:16px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--bg);background:var(--fg);border:0;border-radius:999px;padding:12px 18px;min-height:44px;cursor:pointer}
.again:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.home{display:inline-block;margin-top:12px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);text-decoration:none;padding:10px 0}
.home:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:760px) and (min-aspect-ratio:21/20){
  .step{height:100vh;align-items:center;padding-left:max(48px,6vw,env(safe-area-inset-left,0px));padding-bottom:0}
  .card{max-width:min(30rem,36vw);background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
  .card h2{font-size:clamp(38px,3.9vw,62px)}
  .body{font-size:18px}
  .hud{padding-top:20px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));font-size:12px}
  .bar{left:max(32px,env(safe-area-inset-left,0px));right:max(32px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion: reduce){.hint i{animation:none;transform:none}}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<div class="hud" aria-hidden="true"><span class="chap" id="chap">I · Points</span><span class="count"><b id="num">001</b> / 100</span><div class="bar"><i id="bar"></i></div></div>
<h1 class="sr">One hundred moves: machine learning told with one field of points</h1>
<main id="steps"></main>

<script>
(()=>{
'use strict';
const N=420, TAU=Math.PI*2;
const H=(i,k)=>{const x=Math.sin(i*127.1+k*311.7)*43758.5453;return x-Math.floor(x);};
const G=(i,k)=>{const g=Math.sqrt(-2*Math.log(H(i,k)*.9998+1e-4))*Math.cos(TAU*H(i,k+7));return g>2.4?2.4:g<-2.4?-2.4:g;};
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t);};
const sig=x=>1/(1+Math.exp(-x));
const softmax=(z,T)=>{const m=Math.max(...z);const e=z.map(v=>Math.exp((v-m)/T));const s=e.reduce((a,b)=>a+b,0);return e.map(v=>v/s);};
function along(P,t){const k=clamp(t,0,P.length-1);const a=Math.floor(k),f=k-a;const p=P[a],q=P[Math.min(P.length-1,a+1)];return [lerp(p[0],q[0],f),lerp(p[1],q[1],f)];}

/* ---------- drawing helpers (unit space: x right, y up, about -1..1) ---------- */
let ctx, RGB=[[15,29,43],[45,87,207],[184,119,8],[185,194,206]], BG='#ECEFF3', MUTED='#4B5868';
const V={cx:0,cy:0,R:1}; V.X=x=>V.cx+x*V.R; V.Y=y=>V.cy-y*V.R;
const FG=0, BL=1, GD=2, FT=3;
const MONO="'IBM Plex Mono', ui-monospace, Menlo, monospace", DISP="'Bricolage Grotesque', 'Avenir Next', system-ui, sans-serif";
function rgba(c,a){const v=RGB[c];return 'rgba('+v[0]+','+v[1]+','+v[2]+','+a+')';}
function line(x0,y0,x1,y1,c,a,w=1.5,dash){ctx.save();ctx.strokeStyle=rgba(c,a);ctx.lineWidth=w;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(V.X(x0),V.Y(y0));ctx.lineTo(V.X(x1),V.Y(y1));ctx.stroke();ctx.restore();}
function poly(P,upto,c,a,w=2,dash){if(upto<=0||!P.length)return;ctx.save();ctx.strokeStyle=rgba(c,a);ctx.lineWidth=w;ctx.lineJoin='round';ctx.lineCap='round';if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(V.X(P[0][0]),V.Y(P[0][1]));const n=Math.min(P.length-1,Math.floor(upto));for(let k=1;k<=n;k++)ctx.lineTo(V.X(P[k][0]),V.Y(P[k][1]));if(n<P.length-1){const q=along(P,upto);ctx.lineTo(V.X(q[0]),V.Y(q[1]));}ctx.stroke();ctx.restore();}
function arrow(x0,y0,x1,y1,c,a,w=2.5){line(x0,y0,x1,y1,c,a,w);const X1=V.X(x1),Y1=V.Y(y1);const ang=Math.atan2(Y1-V.Y(y0),X1-V.X(x0));const L=Math.max(8,V.R*.045);ctx.save();ctx.fillStyle=rgba(c,a);ctx.beginPath();ctx.moveTo(X1,Y1);ctx.lineTo(X1-L*Math.cos(ang-.42),Y1-L*Math.sin(ang-.42));ctx.lineTo(X1-L*Math.cos(ang+.42),Y1-L*Math.sin(ang+.42));ctx.closePath();ctx.fill();ctx.restore();}
function text(t,x,y,a,o={}){const c=o.c===undefined?-1:o.c, size=o.size||.062, align=o.align||'center';ctx.save();ctx.globalAlpha=clamp(a);ctx.fillStyle=c<0?MUTED:rgba(c,1);ctx.font=(o.weight||500)+' '+Math.max(12,V.R*size)+'px '+(o.disp?DISP:MONO);ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(t,V.X(x),V.Y(y));ctx.restore();}
function circ(x,y,r,c,a,dash){ctx.save();ctx.strokeStyle=rgba(c,a);ctx.lineWidth=1.5;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.arc(V.X(x),V.Y(y),Math.max(1,r*V.R),0,TAU);ctx.stroke();ctx.restore();}
function rect(x0,y0,x1,y1,c,a,fill){ctx.save();const X=V.X(x0),Y=V.Y(y1),w=V.X(x1)-X,h=V.Y(y0)-Y;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(X,Y,w,h,Math.min(10,V.R*.03));else ctx.rect(X,Y,w,h);if(fill){ctx.fillStyle=rgba(c,a);ctx.fill();}else{ctx.strokeStyle=rgba(c,a);ctx.lineWidth=1.5;ctx.stroke();}ctx.restore();}
function cut(nx,ny,b,a,c=FG,dash){const px=-b*nx,py=-b*ny,dx=-ny,dy=nx,L=1.25;line(px-dx*L,py-dy*L,px+dx*L,py+dy*L,c,a*.85,2,dash);}
function axes(xl,yl,a){line(-.95,-.68,.95,-.68,FG,a*.35,1.2);line(-.95,-.68,-.95,.72,FG,a*.35,1.2);if(xl)text(xl,.95,-.78,a,{align:'right',size:.052});if(yl)text(yl,-.95,.8,a,{align:'left',size:.052});}

/* ---------- shared shapes ---------- */
const T1=[-.45,.32], T2=[.45,-.32];
function cloudPt(i,sep=1){const cl=i%2,c=cl?T2:T1;return [c[0]*sep+G(i,11)*.2,c[1]*sep+G(i,13)*.2,cl];}
const XC=[[.5,.5],[-.5,-.5],[-.5,.5],[.5,-.5]];
function xorPt(i){const q=i%4,c=XC[q];return [c[0]+G(i,21)*.13,c[1]+G(i,23)*.13,q<2?0:1];}
const BX=1.15, BY=.7;
function ring(i){const j=i%7,k=Math.floor(i/7),n=60;const a=k/n*TAU+j*.3;const r=.14+.135*j;return [BX*r*Math.cos(a),BY*r*Math.sin(a),j];}
function bowlF(x,y){return (x/BX)**2+(y/BY)**2;}
function gdPath(lr,beta,steps){let x=-.95,y=.42,vx=0,vy=0;const P=[[x,y]];for(let t=0;t<steps;t++){const gx=2*x/(BX*BX),gy=2*y/(BY*BY);vx=beta*vx-lr*gx;vy=beta*vy-lr*gy;x+=vx;y+=vy;P.push([x,y]);}return P;}
function spiralPt(i){const u=(i+.5)/N;const th=u*4.4*Math.PI+.4;const r=.1+.86*u;return [r*Math.cos(th)+G(i,101)*.012,r*Math.sin(th)+G(i,103)*.012];}
function pairBase(g){return [(H(g,131)-.5)*1.6,(H(g,133)-.5)*1.4];}

/* ---------- formations: each returns {prep?(s), p(i,s,o), draw?(s,a)} ---------- */
const F={};

F.scatter=()=>({p(i,s,o){const a=H(i,1)*TAU+s*.9*(H(i,5)-.5),r=Math.sqrt(H(i,2))*1.02;o.x=r*Math.cos(a);o.y=r*Math.sin(a);const h=H(i,3);o.c=h<.1?BL:h<.17?GD:FT;o.r=.7+H(i,4)*.9;}});

F.grid=()=>({p(i,s,o){const c=i%20,r=Math.floor(i/20);o.x=(c-9.5)/10.5;o.y=(10-r)/10.5;const w=Math.sin(c*.55+r*.35-s*7);o.r=.7+.5*w;o.c=((c*7+r*13)%17===0)?BL:FT;o.a=.55+.45*(w*.5+.5);}});

F.clouds=(mode)=>{let nx=1,ny=0,b=0,show=mode!=='plain',sep=1,layer=1;return{
  prep(s){let th=146;sep=1;
    if(mode==='wrong'){th=60;b=.12;}
    else if(mode==='learn'){th=lerp(60,146,ease(s));b=lerp(.12,0,ease(s));}
    else {b=0;}
    if(mode==='probe'){sep=lerp(.12,1,ease(s));layer=Math.round(lerp(1,24,ease(s)));}
    nx=Math.cos(th*Math.PI/180);ny=Math.sin(th*Math.PI/180);},
  p(i,s,o){const [x,y,cl]=cloudPt(i,sep);o.x=x;o.y=y;o.c=cl?GD:BL;
    if(show){const side=nx*x+ny*y+b;const wrong=cl===0?side<0:side>0;if(wrong)o.r=1.9;else o.a=.8;}},
  draw(s,a){if(!show)return;cut(nx,ny,b,a);
    if(mode==='margin'){cut(nx,ny,-.2,a*.6,FT,[5,5]);cut(nx,ny,.2,a*.6,FT,[5,5]);}
    if(mode==='probe')text('layer '+layer+' of 24',-.95,.92,a,{align:'left'});}};};

F.xor=(mode)=>{let nx=1,ny=0,b=0;return{
  prep(s){if(mode==='spin'){const th=s*TAU*1.25+.3;nx=Math.cos(th);ny=Math.sin(th);b=.08*Math.sin(s*9);}},
  p(i,s,o){let [x,y,cl]=xorPt(i);o.c=cl?GD:BL;
    if(mode==='fold'||mode==='folded'){const t=mode==='folded'?1:ease(s);y=lerp(y,1.9*x*y,t);}
    o.x=x;o.y=y;
    if(mode==='spin'){const side=nx*x+ny*y+b;const wrong=cl===0?side<0:side>0;o.r=wrong?1.8:1;if(!wrong)o.a=.75;}},
  draw(s,a){if(mode==='spin')cut(nx,ny,b,a);if(mode==='folded')cut(0,1,0,a);}};};

F.knn=()=>{let q=[0,0],thr=0,maj=BL;const d=new Float32Array(N);return{
  prep(s){q=[lerp(-.75,.75,s),.25*Math.sin(s*TAU)-.05];
    for(let i=1;i<N;i++){const p=cloudPt(i);d[i]=Math.hypot(p[0]-q[0],p[1]-q[1]);}
    const arr=Array.from(d.subarray(1)).sort((a,b)=>a-b);thr=arr[6];
    let t=0;for(let i=1;i<N;i++)if(d[i]<=thr)t+=(i%2===0)?1:-1;maj=t>=0?BL:GD;},
  p(i,s,o){if(i===0){o.x=q[0];o.y=q[1];o.c=maj;o.r=2.8;return;}const [x,y,cl]=cloudPt(i);o.x=x;o.y=y;o.c=cl?GD:BL;if(d[i]<=thr)o.r=1.9;else o.a=.4;},
  draw(s,a){circ(q[0],q[1],thr,FG,a*.5,[4,4]);}};};

F.pca=()=>{const phi=30*Math.PI/180,c=Math.cos(phi),sn=Math.sin(phi);let ang=0;return{
  prep(s){const k=ease(s)*3;const v1=-.17*Math.pow(.5625,k),v2=-.98*Math.pow(.0324,k);ang=Math.atan2(v2,v1)+phi;},
  p(i,s,o){const u=G(i,31)*.46,v=G(i,33)*.14;const x=u*c-v*sn,y=u*sn+v*c;o.x=x;o.y=y;o.c=FT;o.r=.95;
    const pr=x*Math.cos(ang)+y*Math.sin(ang);if(s>.5&&Math.abs(pr)>.45){o.c=BL;}},
  draw(s,a){const dx=Math.cos(ang),dy=Math.sin(ang);arrow(-dx*1.05,-dy*1.05,dx*1.05,dy*1.05,GD,a,2.5);}};};

F.bowl=(mode)=>{const P=mode==='bounce'?gdPath(.42,0,14):mode==='momentum'?gdPath(.05,.8,30):gdPath(.12,0,14);let t=0;return{
  prep(s){t=mode==='still'?0:ease(s)*(P.length-1);},
  p(i,s,o){if(i===0){const q=along(P,t);o.x=q[0];o.y=q[1];o.c=GD;o.r=3.2;return;}const [x,y,j]=ring(i);o.x=x;o.y=y;o.c=j<2?BL:FT;o.r=.8;o.a=.45+.55*(1-j/7);},
  draw(s,a){if(mode!=='still')poly(P,t,GD,a*.85,2);}};};

F.basins=()=>{const BA=[-.48,.05],BB=[.55,-.2];const mk=(x,y,C)=>{const P=[];for(let t=0;t<40;t++){P.push([x,y]);x+=(C[0]-x)*.12+.012*Math.sin(t*.6);y+=(C[1]-y)*.12;}return P;};
  const P1=mk(.02,.72,BA),P2=mk(.12,.72,BB);let t=0;return{
  prep(s){t=ease(s)*39;},
  p(i,s,o){if(i<2){const q=along(i?P2:P1,t);o.x=q[0];o.y=q[1];o.c=GD;o.r=3;return;}
    const half=i%2,C=half?BB:BA;const j=Math.floor(i/2)%6,k=Math.floor(i/12);const a=k/35*TAU+j*.4;const r=.08+.075*j*(half?1.12:1);
    o.x=C[0]+r*Math.cos(a)*1.1;o.y=C[1]+r*Math.sin(a)*.85;o.c=j<1?BL:FT;o.a=.45+.55*(1-j/6);o.r=.8;},
  draw(s,a){poly(P1,t,GD,a*.8,2);poly(P2,t,GD,a*.8,2);}};};

const GL=[3,4,4,2],GN=[];GL.forEach((n,l)=>{for(let k=0;k<n;k++)GN.push([-.9+l*.6,(k-(n-1)/2)*.38]);});
const GE=[];{let off=0;for(let l=0;l<GL.length-1;l++){for(let a=0;a<GL[l];a++)for(let b=0;b<GL[l+1];b++)GE.push([off+a,off+GL[l]+b]);off+=GL[l];}}
F.graph=(mode)=>{let front=0;return{
  prep(s){front=mode==='fwd'?lerp(-1.2,1.2,s):mode==='back'?lerp(1.2,-1.2,s):-2;},
  p(i,s,o){const n=i%13,k=Math.floor(i/13);const [nx,ny]=GN[n];const a=k/33*TAU+s*1.5;const rr=.05+.02*(k%3);o.x=nx+rr*Math.cos(a);o.y=ny+rr*Math.sin(a);o.r=.8;
    if(mode==='fwd')o.c=nx<=front?BL:FT;else if(mode==='back')o.c=nx>=front?GD:BL;else o.c=GD;},
  draw(s,a){for(const [p,q] of GE){const A=GN[p],B=GN[q];let c=FT,al=.5;
      if(mode==='fwd'&&B[0]<=front){c=BL;al=.6;}
      if(mode==='back'){c=A[0]>=front?GD:BL;al=.5;}
      if(mode==='all'){c=GD;al=.45;}
      line(A[0],A[1],B[0],B[1],c,a*al,1.2);}
    if(mode!=='all'&&front>-1.1&&front<1.1)line(front,-.85,front,.85,mode==='fwd'?BL:GD,a*.5,1,[3,5]);}};};

const LY=[5,8,8,8,3],LN=[];LY.forEach((n,l)=>{for(let k=0;k<n;k++)LN.push([-.9+l*.45,(k-(n-1)/2)*.2]);});
F.layers=()=>({p(i,s,o){const n=i%LN.length,k=Math.floor(i/LN.length);const [x,y]=LN[n];const a=k/14*TAU;o.x=x+.035*Math.cos(a);o.y=y+.035*Math.sin(a);
    const l=Math.round((x+.9)/.45);const wave=Math.exp(-Math.pow(l-(s*5.5-.5),2)*1.2);o.c=wave>.5?BL:FG;o.a=.3+.7*wave;o.r=.7+.5*wave;},
  draw(s,a){let off=0;for(let l=0;l<LY.length-1;l++){for(let p=0;p<LY[l];p++)for(let q=0;q<LY[l+1];q++){const A=LN[off+p],B=LN[off+LY[l]+q];line(A[0],A[1],B[0],B[1],FT,a*.35,.8);}off+=LY[l];}}});

    if(mode==='run'){if(gen>g){o.a=0;return;}const cur=gen>g-1;o.c=cur?BL:FT;o.a=cur?1:Math.exp(-(g-gen)*.35)*.8+.1;}
    else{if(gen>=12&&i%2){const t=ease(s);o.y=lerp(y,.85+(H(i,327)-.5)*.1,t);o.c=GD;}else{o.c=gen>=18?BL:FT;o.a=gen>=12?1:.3;}}},
  draw(s,a){const P=[];for(let x=-1;x<=1.001;x+=.02)P.push([x,EVY(x)]);poly(P,P.length,FG,a*.35,1.5);
    if(mode==='run')text('generation '+Math.round(g),-.95,.92,a,{align:'left',size:.052});
    else{text('real score',.95,-.68,a,{align:'right',c:BL,size:.05});text('score it claims',.95,1.0,a*sstep(.2,.7,s),{align:'right',c:GD,size:.05});}}};};

F.motifs=()=>{const sub=[F.spiral('data'),F.graph('all'),F.rays('rotate'),F.chains('vote'),F.panels('tidy')];const L=['hide, predict','one local rule','lookup','propose, keep','controls'];const tmp={};let rot=0;return{
  prep(s){rot=ease(s)*.5;sub.forEach(f=>f.prep&&f.prep(.5));},
  p(i,s,o){const j=i%5;tmp.x=0;tmp.y=0;tmp.c=0;tmp.r=1;tmp.a=1;sub[j].p(i,.5,tmp);const ang=Math.PI/2-j*TAU/5+rot;o.x=.62*Math.cos(ang)+tmp.x*.25;o.y=.62*Math.sin(ang)+tmp.y*.25;o.c=tmp.c;o.r=tmp.r*.8;o.a=tmp.a;},
  draw(s,a){for(let j=0;j<5;j++){const ang=Math.PI/2-j*TAU/5+rot;text(L[j],.62*Math.cos(ang),.62*Math.sin(ang)-.32,a,{size:.045});}}};};

/* ---------- the hundred moves ---------- */
const CH=[['I','Points',0],['II','A line that learns',4],['III','Downhill',12],['IV','Words to numbers',23],['V','Attention',31],['VI','Hide and predict',40],
  ['VII','Looking inside',49],['VIII','How learning goes',58],['IX','Scale',67],['X','More from one model',73],['XI','Acting',83],['XII','What came back',93]];
const chOf=b=>{let c=0;for(let k=0;k<CH.length;k++)if(b>=CH[k][2])c=k;return c;};
const B=[
[F.scatter(),'Machine learning in a hundred moves','420 points. Scroll, and they take every shape this field depends on.'],
[F.grid(),'Data is a grid of numbers','Every photo, word and sound a model sees arrives as a table of numbers like this one.'],
[F.clouds('plain'),'To learn is to find a rule','Two kinds of points. The task: tell them apart, and do it for points you have not seen yet.'],
[F.clouds('wrong'),'The simplest rule is a line','Blue on one side, gold on the other. This first guess gets many of them wrong.'],
[F.clouds('learn'),'Nudge the line at each mistake','When a point lands on the wrong side, add it to the weights or subtract it, by its label. That is the whole perceptron.'],
[F.clouds('margin'),'It always stops','If some line can split the data, the nudges end. A proof from 1962 bounds how many there will be.'],
[F.xor('plain'),'Some patterns no line can split','Blue in two opposite corners, gold in the other two. Any line gets at least one corner wrong.'],
[F.xor('spin'),'The simple rule never settles','On this pattern the perceptron turns forever, one mistake after another.'],
[F.xor('fold'),'Bend the space first','One hidden layer moves the points, so blue rises and gold sinks.'],
[F.xor('folded'),'Then a line works again','This is what a neural network does: reshape the data until a straight cut will do.'],
[F.knn(),'Or skip the rule: ask the neighbours','Label a new point by the seven points nearest to it. There is nothing to train.'],
[F.pca(),'Find the direction that matters','Multiply any arrow by the data’s covariance, again and again. It turns until it points where the data spreads most.'],
[F.bowl('still'),'Turn error into height','For every setting of the weights, measure the error. The result is a landscape.'],
[F.bowl('roll'),'Then walk downhill','Take a small step against the slope, and repeat. This is gradient descent.'],
[F.bowl('bounce'),'Step size decides a lot','Too small and you crawl. Too large and you bounce from wall to wall.'],
[F.bowl('momentum'),'Keep some of the last step','Momentum carries speed through flat stretches and damps the bounce.'],
[F.basins(),'Real landscapes have many valleys','Where you end up depends on where you start. In large networks most valleys turn out good enough.'],
[F.graph('fwd'),'A network has a slope per weight','Millions of them. Measuring each one by trial would never finish.'],
[F.graph('back'),'So send the error backwards','Each node multiplies the signal it receives by its own local slope and passes it on.'],
[F.graph('all'),'One pass gives every slope','That is backpropagation: one small rule, run in reverse order through the graph.'],
[F.layers(),'Stack the pieces into layers','Weighted sums, each followed by a bend. A neural network is nothing more.'],
[F.relu(1,4),'Each bend is a cut','A ReLU unit switches on along a straight line. Four units, and the plane breaks into pieces.'],
[F.relu(4,14),'Inside each piece, a plain map','Add units and the pieces multiply. Within any one piece the network is linear.'],
[F.tokens(0,0),'Text must become numbers too','Start from single characters. Here, “low lower lowest” is sixteen symbols.'],
[F.tokens(0,1),'Merge the commonest pair','“l” and “o” sit side by side three times. Make them one symbol.'],
[F.tokens(1,3),'Repeat until the list is full','Merge after merge, frequent pieces become tokens. The list of merges is the whole tokenizer.'],
[F.embed('gather'),'Each token becomes a point','A learned table gives every token a place in a space of many dimensions.'],
[F.embed('cluster'),'Near means alike','Training pulls words that are used the same way toward each other.'],
[F.embed('analogy'),'Directions carry meaning','The step from one word to a related one often points the same way across many pairs.'],
[F.bars('prob'),'Guess the next token','A language model scores every token it knows. A softmax turns the scores into odds.'],
[F.bars('temp'),'Temperature sets the boldness','Divide the scores before the softmax. Low temperature backs the favourite; high spreads the bets.'],
[F.rays('query'),'How does a token use the others?','It sends out a query, and every other token offers a key.'],
[F.rays('rotate'),'Match by dot product','The better a key lines up with the query, the larger its weight.'],
[F.rays('blend'),'Then blend the values','The answer is an average of the tokens’ values, weighted by those matches. Every part can be learned.'],
[F.matrix('full'),'Every token asks at once','One row per query, one column per key: a grid of weights.'],
[F.matrix('causal'),'No peeking ahead','Mask the upper triangle so each token reads only what came before it.'],
[F.matrix('head'),'Each head learns a habit','This one looks one step back. Others find the subject, or the opening bracket.'],
[F.stack(),'Repeat the block','Attention, then a small network, a few dozen times over. That is a transformer.'],
[F.matrix('cache'),'Keep what you already computed','Store each token’s key and value as you go. Writing token 100 no longer redoes tokens 0 to 99.'],
[F.patches(),'Pictures become tokens too','Cut an image into patches, line them up, and the same transformer reads them.'],
[F.spiral('data'),'Where do labels come from?','Mostly, nobody writes them. The data supplies its own.'],
[F.spiral('mask'),'Hide part, predict it back','Cover the next word, a patch of image, a frame of video. Guessing it is the training signal.'],
[F.diffuse('forward'),'Add noise, a little at a time','A fixed recipe blurs the data into static. Nothing here is learned.'],
[F.diffuse('noise'),'Learn to name the noise','Show a network a noisy sample and ask which noise was added. One squared error is the whole loss.'],
[F.diffuse('reverse'),'Then run it backwards','Start from pure static and remove the predicted noise, step by step. Data appears.'],
[F.fill(),'Text can be written this way','Start from a line of blanks and fill in the surest characters first, in any order.'],
[F.views(),'Or match two views','Two crops of one photo should land close together. No label says what the photo shows.'],
[F.collapse(),'The cheat: one point for all','Map every input to the same spot and every prediction is perfect, and worthless.'],
[F.spread(),'Make spread a rule','Add a term that keeps the points apart, or predict a slow-moving copy. The cheat no longer works.'],
[F.superpos('rays'),'What does a model store?','Often more features than it has dimensions: here, five in a plane.'],
[F.superpos('interfere'),'Rare features can share','If they seldom fire together, the overlap rarely gets in the way.'],
[F.dict(),'Read them with a dictionary','Rewrite each activation as a few directions from a long list. The few that fire name what the model sees.'],
[F.clouds('probe'),'Ask with a straight line','Train a line to read one fact from one layer. Deeper layers often make the fact plain.'],
[F.matrix('patch'),'Or swap a piece and watch','Copy one activation from a clean run into a broken one. If the answer returns, you found where it lives.'],
[F.steer(),'Push along a feature','Add a direction to the model’s state, and its replies lean toward that topic.'],
[F.panels('reveal'),'Would a random network do the same?','Run the same tool on an untrained copy. Often it looks just as tidy.'],
[F.panels('tidy'),'The control is the result','Without a random baseline, a clean picture proves nothing about learning.'],
[F.truth(),'Grade the tool on known answers','Build a model whose features you chose, then count how many the tool finds.'],
[F.curves(Object.assign({r0:0,r1:.5},GROK)),'Fit first, understand later','A small network scores 100% on its training set long before it finds the rule.'],
[F.curves(Object.assign({r0:.5,r1:1},GROK)),'Then, late, it generalizes','With weight decay, test accuracy passed 95% about 45 times later than the training fit. Without decay, never.'],
[F.decay(),'Small weights win','Decay shrinks every weight a little each step. Of all the answers that fit, the simple one lasts.'],
[F.forget('full'),'New learning can erase old','Fine-tune on new text and the old skill drifts away.'],
[F.forget('replay'),'Mix in a little of the old','Replaying old examples while learning new ones keeps most of what was there.'],
[F.mezo('probe'),'Learn without going backwards?','Nudge every weight along one random direction, both ways, and compare the two errors.'],
[F.mezo('step'),'Two forward passes, one slope','The gap estimates the slope along that direction. Memory stays at what running the model costs.'],
[F.state(),'Memory need not grow','Instead of keeping every past token, carry one fixed-size state and update it at each step.'],
[F.delta(),'Write by correcting','Store a value under a key by fixing what the memory now returns for it. That is one step of gradient descent.'],
[F.power('curves'),'Bigger models, lower loss','Train one recipe at six sizes and watch each loss curve settle.'],
[F.power('line'),'A straight line on log axes','Loss falls as a power of size. One fit predicts the next size up.'],
[F.power('envelope'),'Each budget has a best size','Too large and it sees too little data; too small and it stops improving. The lower edge is the plan.'],
[F.icl(1,4),'Learning inside the prompt','Show a trained model a few examples of a new rule. It continues the pattern, with no weight changed.'],
[F.icl(4,12),'It acts like a fit','On simple tasks its guesses follow least squares on the examples in front of it.'],
[F.icl(12,24),'More examples, better guesses','Error falls with each pair added, as if a small learner ran inside one forward pass.'],
[F.chains('think'),'Let it think out loud','Asked to write its steps first, a small model went from <b>15%</b> to <b>61.5%</b> on 200 school maths problems.'],
[F.chains('vote'),'Sample many, take the vote','Wrong chains scatter across answers; right ones agree. Eight votes lifted accuracy to <b>69.5%</b>.'],
[F.prompts('search'),'Tune the prompt like a weight','Freeze the model. Let another model propose instructions, score each, and keep the best.'],
[F.prompts('heldout'),'Check on unseen questions','The best of many prompts on a few questions is partly luck. Only fresh questions tell.'],
[F.passages('rank'),'Give it the right page','Score every passage against the question and paste the best one into the prompt.'],
[F.passages('pull'),'Plain word counts held up','On one test, word matching put the right paragraph first <b>75.5%</b> of the time; a neural search, <b>62.5%</b>.'],
[F.quant('hist'),'Weights crowd near zero','Most weights are small. Few need the precision they are stored in.'],
[F.quant('q16'),'Sixteen levels per weight','Four bits each, with one scale per group of 64, cut a model from <b>723.6 MB</b> to <b>203.6 MB</b>.'],
[F.quant('q3'),'Or train with three values','Weights of −1, 0 and 1 from the start. The model learns around the rounding.'],
[F.quant('prune'),'Remove the smallest','Drop the tenth of weights nearest zero and little changes. Drop a random tenth and the model breaks.'],
[F.bandit(0,24),'No labels, only rewards','Four levers with unknown payouts. Each pull returns a win or nothing.'],
[F.bandit(24,420),'Try, then favour what paid','Pull every lever early; pull the best one more as the evidence builds.'],
[F.policy(),'Make good actions likelier','Raise each action’s probability in step with the reward that followed it.'],
[F.curves(Object.assign({r0:0,r1:1},CLIP)),'But not too fast','Clip each update so the new policy stays near the old one. Unclipped, training rose, then collapsed.'],
[F.grid8('world'),'Imagine before acting','Learn how the world answers each move, then try moves inside that model first.'],
[F.grid8('plan'),'Try many futures, keep one step','Score random plans in imagination, take the best plan’s first move, and plan again. On a grid it reached <b>75.7%</b> of goals.'],
[F.checker('grade'),'Grade with a program','Sample eight replies, mark each right or wrong, and push the right ones up against the group’s mean.'],
[F.checker('noise'),'Noise is not neutral','Train on coin-flip grades and the model does not stay put. Its accuracy fell from <b>59.1%</b> to <b>4.6%</b>.'],
[F.evo('run'),'Evolve programs','A language model proposes changes to code. A checker keeps what works. The best become parents.'],
[F.evo('cheat'),'Without a checker, it cheats','The search learned to inflate its own scores, and lost a better rule it had found.'],
[F.motifs(),'Five ideas kept coming back','Read the whole field at once and the same few moves show up again and again.'],
[F.spiral('mask'),'Hide part, predict it','Text, images, sound and worlds all train on this one move.'],
[F.graph('back'),'One local rule, run everywhere','From the perceptron to backprop, each weight moves against a slope it can measure nearby.'],
[F.rays('blend'),'Lookup is a dot product','Attention, retrieval and memory all score keys against a query and blend what they find.'],
[F.chains('vote'),'Propose, score, keep','Votes, rewards, prompt search and evolution: the scorer does the real work.'],
[F.panels('tidy'),'No number without its control','A floor, a ceiling, a random copy: the test that could have failed.'],
[F.scatter(),'420 points, one field','Every shape here came from a few simple moves. Scroll back up and watch them again.']
];

/* ---------- page ---------- */
const main=document.getElementById('steps');
B.forEach((b,j)=>{const ch=CH[chOf(j)];const sec=document.createElement('section');sec.className='step';
  const words=b[1].split(' ').map(w=>'<span class="w">'+w+'</span>').join(' ');
  let extra='';if(j===0)extra='<p class="hint"><i></i>Scroll</p>';if(j===B.length-1)extra='<button class="again" id="again" type="button">Back to the first move</button><br><a class="home" href="../index.html">Back to the course</a>';
  sec.innerHTML='<div class="card"><p class="kicker"><span>'+ch[0]+' · '+ch[1]+'</span><span>'+String(j+1).padStart(3,'0')+'</span></p><h2>'+words+'</h2><p class="body">'+b[2]+'</p>'+extra+'</div>';
  main.appendChild(sec);});
const steps=[...main.children], cards=steps.map(s=>s.firstChild), WD=cards.map(c=>[...c.querySelectorAll('.w')]), BD=cards.map(c=>c.querySelector('.body'));
const RM=matchMedia('(prefers-reduced-motion: reduce)');let reduce=RM.matches;RM.addEventListener('change',e=>{reduce=e.matches;dirty=true;});
document.getElementById('again').addEventListener('click',()=>window.scrollTo({top:0,behavior:reduce?'auto':'smooth'}));

const cv=document.getElementById('stage');ctx=cv.getContext('2d');
let W=0,Hh=0,lastVH=0,stepH=1,base=2,dirty=true;
function layout(){const p0=stepH>1?window.scrollY/stepH:0;const dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;Hh=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  const vh=window.innerHeight;lastVH=vh;const wide=matchMedia('(min-width:760px) and (min-aspect-ratio:21/20)').matches;
  if(wide){V.cx=W*.68;V.cy=vh*.52;V.R=Math.min(W*.24,vh*.4);}else{V.cx=W/2;V.cy=vh*.31+10;V.R=Math.min(W*.44,vh*.25);}
  stepH=steps[0].getBoundingClientRect().height||vh;base=clamp(V.R*.0115,1.6,4.4);dirty=true;if(p0)window.scrollTo(0,p0*stepH);}
function readTheme(){const cs=getComputedStyle(document.documentElement);const hex=n=>{const v=cs.getPropertyValue(n).trim().replace('#','');return[parseInt(v.slice(0,2),16),parseInt(v.slice(2,4),16),parseInt(v.slice(4,6),16)];};
  RGB=[hex('--fg'),hex('--blue'),hex('--gold'),hex('--faint')];BG=cs.getPropertyValue('--bg').trim();MUTED=cs.getPropertyValue('--muted').trim();dirty=true;}
readTheme();layout();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readTheme);
new MutationObserver(readTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
window.addEventListener('resize',()=>{if(cv.clientWidth!==W||Math.abs(window.innerHeight-lastVH)>140||cv.clientHeight!==Hh)layout();});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{dirty=true;});

const XA=new Float32Array(N),YA=new Float32Array(N),CA=new Uint8Array(N),RA2=new Float32Array(N),AA=new Float32Array(N);
const XB=new Float32Array(N),YB=new Float32Array(N),CB=new Uint8Array(N),RB=new Float32Array(N),AB=new Float32Array(N);
const o={x:0,y:0,c:0,r:1,a:1};
function evalF(f,s,X,Y,C,R,A){if(f.prep)f.prep(s);for(let i=0;i<N;i++){o.x=0;o.y=0;o.c=0;o.r=1;o.a=1;f.p(i,s,o);X[i]=o.x;Y[i]=o.y;C[i]=o.c;R[i]=o.r;A[i]=o.a;}}

const elNum=document.getElementById('num'),elChap=document.getElementById('chap'),elBar=document.getElementById('bar');
let shown=new Set(),lastP=-1,lastB=-1;
function cardsAt(p){const lo=Math.max(0,Math.floor(p)-1),hi=Math.min(B.length-1,Math.floor(p)+2);const now=new Set();
  for(let j=lo;j<=hi;j++){now.add(j);const d=j-p;const op=d>=0?1-sstep(.12,.6,d):1-sstep(.08,.3,-d);const c=cards[j];c.style.opacity=op.toFixed(3);
    WD[j].forEach((w,k)=>{const v=clamp(op*1.7-k*.11);w.style.opacity=v.toFixed(3);w.style.transform=reduce?'':'translateY('+((1-v)*.32).toFixed(3)+'em)';});
    BD[j].style.opacity=clamp(op*1.5-.35).toFixed(3);}
  shown.forEach(j=>{if(!now.has(j))cards[j].style.opacity='0';});shown=now;}
cards.forEach((c,j)=>{if(j>1)c.style.opacity='0';});

function frame(now){requestAnimationFrame(frame);if(document.hidden)return;
  const p=clamp(window.scrollY/stepH,0,B.length-1);
  if(reduce&&!dirty&&Math.abs(p-lastP)<1e-4)return;
  const moved=dirty||p!==lastP;dirty=false;lastP=p;
  const q=clamp(p+.3,0,B.length-1);let b=Math.floor(q),s=q-b;if(b>=B.length-1){b=B.length-1;s=0;}
  const sA=clamp(s/.55),m=b<B.length-1?ease(clamp((s-.55)/.45)):0;
  const FA=B[b][0],FB=m>0?B[b+1][0]:null;
  evalF(FA,sA,XA,YA,CA,RA2,AA);if(FB)evalF(FB,0,XB,YB,CB,RB,AB);
  ctx.fillStyle=BG;ctx.fillRect(0,0,W,Hh);
  const ca=chOf(b),cb=FB?chOf(b+1):ca;
  const numeral=(ch,al)=>{if(al<.005)return;ctx.save();ctx.globalAlpha=al;ctx.fillStyle=rgba(FT,1);ctx.font='700 '+Math.round(V.R*1.1)+'px '+DISP;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(CH[ch][0],V.cx,V.cy);ctx.restore();};
  if(ca===cb)numeral(ca,.2);else{numeral(ca,.2*(1-m));numeral(cb,.2*m);}
  if(FA.draw&&m<.99)FA.draw(sA,1-m);
  if(FB&&FB.draw&&m>.01)FB.draw(0,m);
  const tt=reduce?0:now;
  for(let i=0;i<N;i++){let x=XA[i],y=YA[i],r=RA2[i],a=AA[i],c0=RGB[CA[i]],cr=c0[0],cg=c0[1],cbb=c0[2];
    if(FB){x=lerp(x,XB[i],m);y=lerp(y,YB[i],m);r=lerp(r,RB[i],m);a=lerp(a,AB[i],m);const c1=RGB[CB[i]];cr=lerp(cr,c1[0],m);cg=lerp(cg,c1[1],m);cbb=lerp(cbb,c1[2],m);}
    if(a<.01)continue;
    if(tt){x+=Math.sin(tt*.0009+i*1.7)*.005;y+=Math.cos(tt*.0011+i*2.3)*.005;}
    ctx.fillStyle='rgba('+(cr|0)+','+(cg|0)+','+(cbb|0)+','+clamp(a).toFixed(3)+')';ctx.beginPath();ctx.arc(V.X(x),V.Y(y),Math.max(.6,base*r),0,TAU);ctx.fill();}
  if(!moved)return;
  cardsAt(p);
  const bi=Math.round(p);if(bi!==lastB){lastB=bi;elNum.textContent=String(bi+1).padStart(3,'0');const ch=CH[chOf(bi)];elChap.textContent=ch[0]+' · '+ch[1];}
  elBar.style.transform='scaleX('+(p/(B.length-1)).toFixed(4)+')';}
requestAnimationFrame(frame);
})();
