<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>One Hundred Moves</title>
<meta name="description" content="Machine learning in a hundred scroll-driven moves: one field of 420 points reshapes itself into every idea.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<!-- Self-hosted fonts shared with the research pages: no network at runtime. -->
<link rel="stylesheet" href="../research/assets/fonts.css">
<style>
/* Layout: one fixed field of 420 points; a column of short cards scrolls over it, one card per move. */
:root{
  --bg:#ECEFF3; --fg:#0F1D2B; --muted:#4B5868; --blue:#2D57CF; --gold:#B87708; --faint:#B9C2CE;
  --card:rgba(236,239,243,.84); --line:rgba(15,29,43,.12);
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A111C; --fg:#E4EAF2; --muted:#98A6B8; --blue:#7EA2FF; --gold:#F2B23E; --faint:#36435A;
  --card:rgba(10,17,28,.8); --line:rgba(228,234,242,.13); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A111C; --fg:#E4EAF2; --muted:#98A6B8; --blue:#7EA2FF; --gold:#F2B23E; --faint:#36435A;
  --card:rgba(10,17,28,.8); --line:rgba(228,234,242,.13); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#stage{position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;display:block;z-index:0;touch-action:pan-y}
.hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  background:linear-gradient(var(--bg) 50%,transparent)}
/* Only the label row takes taps; the negative margin gives it a 44px target without moving the bar. */
.hud-btn{pointer-events:auto;display:flex;gap:12px;justify-content:space-between;align-items:baseline;width:100%;min-height:44px;margin:-15px 0;padding:15px 0;
  background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hud-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hud .chap::after{content:"";display:inline-block;width:.42em;height:.42em;margin:0 0 .18em .55em;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.hud .count{font-variant-numeric:tabular-nums;white-space:nowrap}
.hud .count b{color:var(--fg);font-weight:500}
.hud .chap{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ticks span{position:absolute;bottom:-2px;width:1.5px;height:6px;margin-left:-.75px;background:var(--muted);opacity:.55}
.bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:4px;height:2px;background:var(--line);border-radius:2px}
.bar i{display:block;height:100%;width:100%;border-radius:2px;transform-origin:left center;transform:scaleX(0);background:var(--blue)}
main{position:relative;z-index:2}
.step{height:86vh;height:86svh;display:flex;align-items:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(3svh + env(safe-area-inset-bottom,0px))}
.step:last-child{height:100vh;height:100lvh}
.card{width:100%;max-width:31rem;min-width:0;background:var(--card);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px 18px}
.kicker{display:flex;justify-content:space-between;gap:12px;margin:0 0 10px;
  font:500 12px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.kicker span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.card h2{margin:0 0 8px;font-family:var(--display);font-weight:700;font-size:clamp(27px,7.6vw,46px);
  line-height:1.02;letter-spacing:-.025em;text-wrap:balance;font-variation-settings:'opsz' 72}
.card h2 .w{display:inline-block}
.body{margin:0;font-size:16px;line-height:1.5;color:var(--muted);max-width:60ch}
.body b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.hint{margin:14px 0 0;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.hint i{display:inline-block;width:1.5px;height:20px;background:currentColor;transform-origin:top;animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0)}45%{transform:scaleY(1);transform-origin:top}55%{transform:scaleY(1);transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.again{margin-top:16px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--bg);background:var(--fg);border:0;border-radius:999px;padding:12px 18px;min-height:44px;cursor:pointer}
.again:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.home{display:inline-flex;align-items:center;min-height:44px;margin-top:12px;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--blue);text-decoration:none;padding:10px 0}
.home:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
html.locked{overflow:hidden}
.take{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:14px;line-height:1.45;color:var(--muted);font-style:italic;max-width:60ch}
.deep{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:transparent;
  color:var(--blue);font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.deep::after{content:"";width:.45em;height:.45em;border:solid currentColor;border-width:1.5px 1.5px 0 0;transform:rotate(45deg)}
.deep:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
/* Dialogs: the deeper sheet (bottom sheet on phones, right panel on wide screens) and the chapter index. */
.dlg{position:fixed;inset:0;z-index:20}
.dlg[hidden]{display:none}
.dlg:not(.open){pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(8,14,22,.4);opacity:0;transition:opacity .28s ease}
.dlg.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:75vh;max-height:75dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.18);outline:none;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.dlg.open .sheet{transform:none}
.handle{flex:none;height:30px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
.handle i{width:40px;height:4px;border-radius:2px;background:var(--faint)}
.x{width:44px;height:44px;flex:none;border:0;border-radius:999px;background:transparent;color:var(--muted);font:300 30px/1 var(--sans);cursor:pointer}
.x:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.sheet .x{position:absolute;top:4px;right:6px}
.scroll{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
.sheet .scroll{padding:0 max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.sheet .kicker{margin-right:40px}
.sheet h2{margin:0 0 14px;font-family:var(--display);font-weight:700;font-size:clamp(25px,6.6vw,34px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.d-text{margin:0 0 16px;font-size:16px;line-height:1.55}
.d-text b,.d-cap b{font-weight:500;font-variant-numeric:tabular-nums}
.d-formula{margin:0 0 16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font:500 14px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.d-cap{margin:0 0 14px;font-size:14px;line-height:1.5;color:var(--muted)}
.lab{display:block;margin-bottom:2px;font:500 12px/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg)}
.d-but{padding-left:12px;border-left:2px solid var(--gold)}
.d-links{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 16px}
.d-link{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--fg);color:var(--bg);
  font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.d-link:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.d-src{margin:0;padding-top:10px;border-top:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--muted)}
.toc{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);outline:none;
  opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .22s ease}
.dlg.open .toc{opacity:1;transform:none}
.toc-head{flex:none;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(8px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.toc-head h2{margin:0;font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.toc .scroll{flex:1;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.toc ol{list-style:none;margin:0 auto;padding:0;max-width:42rem}
.toc-i{display:grid;grid-template-columns:2.9rem minmax(0,1fr) auto;gap:12px;align-items:baseline;width:100%;min-height:44px;padding:14px 10px;
  background:none;border:0;border-radius:12px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.toc li+li .toc-i{box-shadow:inset 0 1px 0 var(--line)}
.toc-i:hover{background:var(--line)}
.toc-i:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.toc-i[aria-current]{background:var(--line);box-shadow:none}
.toc-n{font:700 20px/1 var(--display);color:var(--muted);font-variation-settings:'opsz' 72}
.toc-i[aria-current] .toc-n{color:var(--blue)}
.toc-t{display:block;font:700 19px/1.2 var(--display);letter-spacing:-.01em}
.toc-k{display:block;margin-top:4px;font-size:14px;line-height:1.4;color:var(--muted)}
.toc-r{font:500 12px/1 var(--mono);letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (min-width:760px) and (min-aspect-ratio:21/20){
  .step{height:100vh;align-items:center;padding-left:max(48px,6vw,env(safe-area-inset-left,0px));padding-bottom:0}
  .card{max-width:min(30rem,36vw);background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:0}
  .card h2{font-size:clamp(38px,3.9vw,62px)}
  .body{font-size:18px}
  .hud{padding-top:20px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));font-size:12px}
  .bar{left:max(32px,env(safe-area-inset-left,0px));right:max(32px,env(safe-area-inset-right,0px))}
  .hud-btn{margin:-20px 0 -15px;padding:20px 0 15px}
  .take{font-size:15px}
  .sheet{left:auto;top:0;bottom:0;right:0;width:min(30rem,42vw);max-height:none;border:0;border-left:1px solid var(--line);border-radius:0;
    box-shadow:-12px 0 40px rgba(0,0,0,.14);transform:translateX(100%)}
  .handle{display:none}
  .sheet .x{top:12px;right:12px}
  .sheet .scroll{padding:64px 36px 36px}
  .toc .scroll{padding-top:16px}
}
@media (prefers-reduced-motion: reduce){.hint i{animation:none;transform:none}.scrim,.sheet,.toc{transition:none}}
</style>
</head>
<body>
<canvas id="stage" aria-hidden="true"></canvas>
<header class="hud" id="hud"><button class="hud-btn" id="hudbtn" type="button" aria-haspopup="dialog" aria-controls="toc" aria-label="Chapters"><span class="chap" id="chap">I · Points</span><span class="count"><b id="num">001</b> / <span id="tot">136</span></span></button><div class="bar" aria-hidden="true"><i id="bar"></i><span class="ticks" id="ticks"></span></div></header>
<h1 class="sr">One hundred moves: machine learning told with one field of points</h1>
<main id="steps"></main>
<div class="dlg" id="deep" hidden>
  <div class="scrim" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="deep-title" tabindex="-1">
    <div class="handle" aria-hidden="true"><i></i></div>
    <button class="x" type="button" aria-label="Close" data-close>×</button>
    <div class="scroll"><p class="kicker" id="deep-kick"></p><h2 id="deep-title"></h2><div id="deep-body"></div></div>
  </div>
</div>
<div class="dlg" id="toc" hidden>
  <div class="toc" role="dialog" aria-modal="true" aria-labelledby="toc-title" tabindex="-1">
    <div class="toc-head"><h2 id="toc-title">Chapters</h2><button class="x" type="button" aria-label="Close" data-close>×</button></div>
    <div class="scroll"><ol id="toc-list"></ol></div>
  </div>
</div>

<!-- Card text: content.json verbatim. Code reads it with JSON.parse; titles and bodies here override the in-code ones. -->
<script type="application/json" id="moves-text">
{
 "chapters": [
  {
   "n": "I",
   "name": "Points",
   "takeaway": "Every input a model sees arrives as a table of numbers."
  },
  {
   "n": "II",
   "name": "A line that learns",
   "takeaway": "A line learns by fixing its mistakes; a hidden layer lets a line do more."
  },
  {
   "n": "III",
   "name": "Downhill",
   "takeaway": "Training walks downhill on the error, and one backward pass gives every slope."
  },
  {
   "n": "IV",
   "name": "Fitting too well",
   "takeaway": "A model can fit its training data perfectly and still fail on new data."
  },
  {
   "n": "V",
   "name": "Measuring honestly",
   "takeaway": "A score counts only on data that shaped no choice, and only with its error bars."
  },
  {
   "n": "VI",
   "name": "Words to numbers",
   "takeaway": "Text becomes tokens, tokens become points, and the model scores what comes next."
  },
  {
   "n": "VII",
   "name": "Attention",
   "takeaway": "Each token takes an average of the others, weighted by dot products."
  },
  {
   "n": "VIII",
   "name": "Hide and predict",
   "takeaway": "Hide part of the data and predict it back: the data supplies its own labels."
  },
  {
   "n": "IX",
   "name": "Looking inside",
   "takeaway": "A tool that reads a model proves little until it beats a random network."
  },
  {
   "n": "X",
   "name": "How learning goes",
   "takeaway": "A network can fit long before it generalizes, and forgets fast unless reminded."
  },
  {
   "n": "XI",
   "name": "Scale",
   "takeaway": "Loss falls along a straight line on log axes, and big models learn from the prompt."
  },
  {
   "n": "XII",
   "name": "Adapting a model",
   "takeaway": "A trained model can be changed cheaply: few weights, a teacher, or people’s choices."
  },
  {
   "n": "XIII",
   "name": "More from one model",
   "takeaway": "More tokens, better prompts, the right page and fewer bits each buy something, at a cost."
  },
  {
   "n": "XIV",
   "name": "Tools and agents",
   "takeaway": "An agent is a model, some tools and a loop, and it must be measured over many runs."
  },
  {
   "n": "XV",
   "name": "Acting",
   "takeaway": "With only a reward, a learner makes good actions likelier; a checker keeps it honest."
  },
  {
   "n": "XVI",
   "name": "What came back",
   "takeaway": "A few moves, used again and again, explain most of the field."
  }
 ],
 "moves": {
  "a5": {
   "deeper": {
    "text": "The perceptron scores a point x by w·x and predicts its sign. Add a constant 1 to every point and the bias becomes one more weight. On a mistake, the point is added to w if its label y is +1 and subtracted if y is −1; points it gets right change nothing. There is no learning rate and no loss, only a count of mistakes.",
    "formula": "w ← w + y·x  (on each mistake)",
    "measured": "12 mistakes in 3 epochs (11, 1, 0), then 100% accuracy: perceptron on 200 separable points, seed 1958, module 00a.",
    "sources": [
     "Rosenblatt, 1958"
    ],
    "links": {
     "module": "00a-perceptron",
     "explorable": "00a-perceptron.html",
     "quiz": "00a"
    }
   }
  },
  "a6": {
   "deeper": {
    "text": "Suppose some line splits the data with margin γ, the smallest distance from any point to it, and every point lies within radius R of the origin. Each mistake turns w at least γ toward that line, while its squared length grows by at most R². Both cannot go on forever, so the mistakes must stop. Novikoff proved this in five lines.",
    "formula": "mistakes ≤ (R/γ)²",
    "measured": "Bound 139.57 mistakes; the run made 12, 8.60% of it: R = 4.169359, γ = 0.352921, 200 points, module 00a.",
    "but": "The bound is a worst case: at margin 0.07, five seeds made between 6 and 47 mistakes.",
    "sources": [
     "Novikoff, 1962"
    ],
    "links": {
     "module": "00a-perceptron",
     "explorable": "00a-perceptron.html",
     "quiz": "00a"
    }
   }
  },
  "a7": {
   "deeper": {
    "text": "XOR puts one class on two opposite corners of a square and the other class on the remaining two. A line cuts the plane into two halves, and any half that holds both blue corners also holds a gold one. So the best line gets three of four points right. With no line to find, the perceptron’s weights return to where they started every four updates.",
    "measured": "Best possible line: 75% of the 4 points, found by trying every cut; module 00a.",
    "sources": [
     "Minsky and Papert, 1969"
    ],
    "links": {
     "module": "00a-perceptron",
     "explorable": "00a-perceptron.html",
     "quiz": "00a"
    }
   }
  },
  "a9": {
   "deeper": {
    "text": "Put one hidden layer of two tanh units between input and output. Each unit takes a weighted sum of the inputs and passes it through tanh, a smooth S-shaped curve from −1 to 1. The two outputs give each point new coordinates, and in them the two classes sit on either side of a line. Gradient descent finds the weights; nobody sets them by hand.",
    "measured": "9 parameters, 4 of 4 points right, loss 2.5e−32: 2 → 2 → 1 tanh network on XOR, module 00a.",
    "links": {
     "module": "00a-perceptron",
     "explorable": "00a-perceptron.html",
     "quiz": "00a"
    }
   }
  },
  "a11": {
   "deeper": {
    "text": "k-NN stores the training set and labels a new point by a vote of its k nearest points. Small k follows every noisy point; large k averages more labels and smooths the boundary. When the classes overlap, even the best rule makes some errors: that floor is the Bayes error. Cover and Hart proved that 1-NN ends at most about twice that floor.",
    "measured": "Test error 0.2274 at k = 1 and 0.1593 at k = 151, against a best possible 0.158655: two overlapping Gaussians, 1,000 training points, module 00b.",
    "sources": [
     "Cover and Hart, 1967"
    ],
    "links": {
     "module": "00b-bayes-knn-pca",
     "quiz": "00b"
    }
   }
  },
  "a12": {
   "deeper": {
    "text": "The covariance matrix C records how the data’s coordinates vary together. Multiplying a vector by C stretches it most along the direction where the data spreads most, so repeating the step and rescaling leaves only that direction. This is power iteration, and the direction is the first principal component. Subtract it from C and repeat to find the next one.",
    "formula": "v ← C·v / ‖C·v‖",
    "measured": "PC1 alone holds 28.68% of the pixel variance, and 83 of 784 components hold 90%: FashionMNIST, module 00b.",
    "sources": [
     "Pearson, 1901",
     "Hotelling, 1933"
    ],
    "links": {
     "module": "00b-bayes-knn-pca",
     "explorable": "00b-pca.html",
     "quiz": "00b"
    }
   }
  },
  "a14": {
   "deeper": {
    "text": "The gradient is the list of slopes of the error, one per weight; it points uphill. Gradient descent subtracts a small multiple of it, the learning rate η, and repeats. On least squares, where the answer can also be solved in one step, the walk ends at that same answer.",
    "formula": "w ← w − η·∇L(w)",
    "measured": "400 steps at learning rate 0.05 agree with the solved answer to 1.8e−15: least squares, module 00a.",
    "links": {
     "module": "01-autograd",
     "explorable": "01-gradient-descent.html",
     "quiz": "01"
    }
   }
  },
  "a15": {
   "deeper": {
    "text": "On a bowl-shaped error, the steepest direction sets a speed limit. If the curvature along it is λ, any learning rate above 2/λ makes each step overshoot more than the last, and the weights grow without bound. Below the limit, smaller steps are safe but slow. Adam divides each weight’s step by the size of its recent slopes, so its steps stay near the rate.",
    "formula": "stable only if η < 2/λ_max",
    "measured": "Gradient descent diverged from rate 0.1 up on a tilted bowl with largest curvature 25 (limit 2/25 = 0.08); Adam diverged at none of 37 rates: module 14.",
    "links": {
     "module": "14-how-training-finds-a-solution",
     "explorable": "14-how-training-finds-a-solution.html",
     "quiz": "14"
    }
   }
  },
  "a16": {
   "deeper": {
    "text": "Momentum keeps a running sum of past gradients and steps along that sum. Gradients that agree from step to step add up, so the walk speeds along a long, gentle valley. Gradients that flip sign cancel, which damps the bounce across a narrow one.",
    "formula": "v ← 0.9·v + g;  w ← w − η·v",
    "measured": "Steps to loss below 10⁻³ in the Rosenbrock valley, each at its best rate: gradient descent 3,660, momentum 164, Adam 182; module 14.",
    "but": "On a tilted bowl the three were within a factor of 2.5, and momentum’s count jumped from 76 to 18 to 56 over three neighbouring rates.",
    "links": {
     "module": "14-how-training-finds-a-solution",
     "explorable": "14-how-training-finds-a-solution.html",
     "quiz": "14"
    }
   }
  },
  "a17": {
   "deeper": {
    "text": "Training stops in some valley, and which one depends on the start, the batch size and the rate. A common picture says small batches find wide, flat valleys and that these generalize better. Sharpness can be measured as the top eigenvalue of the Hessian, the matrix of second derivatives: the curvature along the steepest direction.",
    "measured": "Batch 2,048 stopped where the loss curves 16 times more sharply than batch 32 (35.2 against 2.2), yet tested better, 86.2% against 84.8%: MLP on FashionMNIST, module 14.",
    "but": "One pair of runs, and the eigenvalue changes when the same function is written with rescaled weights.",
    "sources": [
     "Keskar et al., 2016",
     "Dinh et al., 2017"
    ],
    "links": {
     "module": "14-how-training-finds-a-solution",
     "explorable": "14-how-training-finds-a-solution.html",
     "quiz": "14"
    }
   }
  },
  "a19": {
   "deeper": {
    "text": "A network is a graph of small operations, and each knows its local derivative: how its output moves when its input moves. Backpropagation starts with slope 1 at the output and walks the graph in reverse. Each node multiplies the slope it receives by its local derivative and adds the result into its inputs. Reverse order makes sure a node has heard from every node that used it.",
    "formula": "slope at input = slope at output × local derivative",
    "measured": "Slopes from backward() agree with finite differences, nudging each input both ways, to about 1e-10: scalar autograd engine, module 01.",
    "links": {
     "module": "01-autograd",
     "explorable": "01-gradient-descent.html",
     "quiz": "01"
    }
   }
  },
  "a21": {
   "deeper": {
    "text": "A layer computes weighted sums of its inputs, one per unit, then bends each through a simple function such as ReLU, which keeps positive values and sets negative ones to zero. Without the bend, a stack of layers would collapse into one linear map. The last layer gives one score per class, and softmax turns the scores into probabilities.",
    "measured": "0.8646 accuracy on the full 10,000 test images: 784 → 256 → 10 network, backward pass written by hand in NumPy, FashionMNIST, module 02.",
    "links": {
     "module": "02-neural-networks",
     "explorable": "02-nn-playground.html",
     "quiz": "02"
    }
   }
  },
  "a22": {
   "deeper": {
    "text": "Each first-layer ReLU unit switches on along one straight line, so the first layer cuts the plane into convex pieces. Inside each piece the second layer’s units switch along more lines. Fix which units are on and the network is one linear map: that set of inputs is a linear region. Cutting polygon by polygon gives the exact count, with no sampling.",
    "measured": "158 regions at init, 236 after training to 100% accuracy: 2 → 12 → 12 → 2 network on two moons, module 15.",
    "links": {
     "module": "15-geometry-of-representations",
     "explorable": "15-geometry-of-representations.html",
     "quiz": "15"
    }
   }
  },
  "a23": {
   "deeper": {
    "text": "In 784 dimensions the regions cannot be drawn, but the regions a straight line crosses can be counted exactly. Along the line, each first-layer unit’s input changes in step with position, so it switches at most once, at a point that can be solved for; between those points the same holds for the second layer. Wider networks cut the line into more pieces, roughly in step with the number of neurons, not with the product of the widths.",
    "measured": "Regions crossed by a line between two test images: 21.3 at width 32, 127.7 at width 256; FashionMNIST, module 15.",
    "but": "One seed and 30 lines: at width 256 the count ran from 40 to 233.",
    "sources": [
     "Hanin and Rolnick, 2019"
    ],
    "links": {
     "module": "15-geometry-of-representations",
     "explorable": "15-geometry-of-representations.html",
     "quiz": "15"
    }
   }
  },
  "a26": {
   "deeper": {
    "text": "Byte-pair encoding starts from the 256 byte values, so any text can be spelled and no word is ever unknown. It counts every adjacent pair, merges the commonest into a new token, and repeats. Common words end as one token, rare ones as a few pieces. Production tokenizers first split text into words and numbers so that merges never cross them.",
    "measured": "SmolLM3’s 128k-token tokenizer splits 4096 into 409 + 6 and 2026 into 202 + 6, so one digit place lands in different tokens: module 03.",
    "but": "Tokens cost more in some languages: SmolLM3 spent 1.36 times as many tokens on five Spanish sentences as on the same sentences in English.",
    "sources": [
     "Petrov et al., 2023"
    ],
    "links": {
     "module": "03-tokenization",
     "explorable": "03-bpe-stepper.html",
     "quiz": "03"
    }
   }
  },
  "a28": {
   "deeper": {
    "text": "The embedding table gives each token a vector, one row per token, learned with the rest of the model. Tokens used in the same contexts must lead to similar predictions, so training pulls their vectors together. Months, numbers, countries and code words form groups before any layer runs.",
    "measured": "Nearest tokens to “July” in the embedding table: “June”, then “July” without its leading space, then “August” and “September”; SmolLM2-360M-Instruct, module 05.",
    "links": {
     "module": "05-transformers-library",
     "explorable": "05-transformer-anatomy.html",
     "quiz": "05"
    }
   }
  },
  "a30": {
   "deeper": {
    "text": "The model ends with one score, a logit, for every token it knows. Softmax raises e to each score and divides by the total, so the results are positive and sum to 1. Generation picks a token from these odds, appends it to the text, and runs again.",
    "formula": "pᵢ = e^zᵢ / Σⱼ e^zⱼ",
    "measured": "91% on “ Paris” after “The capital of France is”, out of 49,152 tokens: SmolLM2-360M-Instruct, module 05.",
    "links": {
     "module": "05-transformers-library",
     "explorable": "05-transformer-anatomy.html",
     "quiz": "05"
    }
   }
  },
  "a31": {
   "deeper": {
    "text": "Dividing the logits by a temperature T before softmax changes the odds without changing the model. T below 1 sharpens them toward the top token; T above 1 flattens them. Top-k keeps a fixed number of tokens. Top-p keeps the smallest set whose odds add up to p, so it keeps more tokens when the model is unsure.",
    "formula": "pᵢ ∝ e^(zᵢ/T)",
    "measured": "After “My favorite color is”, top-p 0.8 keeps 14 tokens where top-k 5 keeps 5: SmolLM2-360M-Instruct, module 05.",
    "links": {
     "module": "05-transformers-library",
     "quiz": "05"
    }
   }
  },
  "a34": {
   "deeper": {
    "text": "Three learned matrices turn each token into a query, a key and a value. Scores are query·key dot products, divided by the square root of the vector size so they do not grow with it and push the softmax to all or nothing. Softmax turns each row of scores into weights that sum to 1, and the output is the weighted average of the values.",
    "formula": "Attention(Q, K, V) = softmax(Q·Kᵀ / √d)·V",
    "links": {
     "module": "04-attention-transformer",
     "explorable": "04-attention.html",
     "quiz": "04"
    }
   }
  },
  "a36": {
   "deeper": {
    "text": "A model that learns to predict the next token must not see that token. Setting every score above the diagonal to minus infinity gives it zero weight after softmax, so token t reads only tokens 0 to t. Training and generation must use the same mask, because at generation time the future does not exist yet.",
    "measured": "Validation loss 1.910 with the mask; 2.875 for a model trained without it and then run with it, as at generation: small char GPTs, 1,500 steps, module 04.",
    "links": {
     "module": "04-attention-transformer",
     "explorable": "04-attention.html",
     "quiz": "04"
    }
   }
  },
  "a38": {
   "deeper": {
    "text": "A block normalizes its input, applies attention, and adds the result back; then it normalizes again, applies a small two-layer network, and adds again. The running sum that each block reads from and adds to is the residual stream. Token and position embeddings go in at the bottom; a score for every possible next token comes out at the top.",
    "measured": "Train loss 4.22 → 1.54, validation loss 1.73, in about 4 minutes: about 620,000 parameters, 3 layers, 4 heads, characters of tiny-shakespeare, module 04.",
    "links": {
     "module": "04-attention-transformer",
     "explorable": "05-transformer-anatomy.html",
     "quiz": "04"
    }
   }
  },
  "a39": {
   "deeper": {
    "text": "Writing one token at a time, each new token needs the keys and values of every earlier token. Without a cache the model recomputes them all at each step, so the work grows with the square of the length. Storing them makes each step cost one new row. The price is memory, which grows with every token.",
    "measured": "490 tokens per second with the cache against 8 without, at 128 tokens of context (63 times faster): Zig engine running module 04’s 619,776-parameter GPT, module 07.",
    "links": {
     "module": "07-inference-internals",
     "explorable": "07-kv-cache.html",
     "quiz": "07"
    }
   }
  },
  "a40": {
   "deeper": {
    "text": "A Vision Transformer cuts a 224 × 224 image into a 14 × 14 grid of 16 × 16 patches. Each patch is flattened and multiplied by a learned matrix to make a token; a position embedding is added, and one extra class token joins them. The same block as for text then runs with no causal mask, so every patch sees every patch.",
    "measured": "95.3% on the test set (122 of 128) after 4 epochs, against 43.8% for CLIP with no training: ViT-tiny fine-tuned on bean-leaf diseases, module 08.",
    "links": {
     "module": "08-vision",
     "explorable": "08-conv-vs-patches.html",
     "quiz": "08"
    }
   }
  },
  "a43": {
   "deeper": {
    "text": "The forward process adds a little Gaussian noise at each of T steps, on a fixed schedule. A sum of Gaussian draws is Gaussian, so any step can be reached in one jump. ᾱ_t, the share of the signal’s variance left at step t, falls from 1 to near 0. Nothing in this part is learned.",
    "formula": "x_t = √ᾱ_t·x₀ + √(1 − ᾱ_t)·ε,  ε ~ N(0, I)",
    "sources": [
     "Ho et al., 2020"
    ],
    "links": {
     "module": "09-diffusion",
     "explorable": "09-diffusion.html",
     "quiz": "09"
    }
   }
  },
  "a44": {
   "deeper": {
    "text": "Pick a clean sample, a random step t and a random noise ε, and make the noisy sample in one jump. A network sees the noisy sample and t and must output ε. The loss is the squared error between the two. The same loss trains a small network on 2-D points and a UNet on images.",
    "formula": "L = ‖ε − ε_θ(x_t, t)‖²",
    "measured": "Loss 0.2678 → 0.0480 over 40 epochs in 3.1 minutes: 376,833-parameter UNet, 10,000 FashionMNIST images, T = 300, module 09.",
    "sources": [
     "Ho et al., 2020"
    ],
    "links": {
     "module": "09-diffusion",
     "explorable": "09-diffusion.html",
     "quiz": "09"
    }
   }
  },
  "a45": {
   "deeper": {
    "text": "Sampling starts from pure noise and steps down from t = T to 0. At each step the network predicts the noise, and the sampler removes part of it; the original method then adds a little fresh noise back. DDIM adds none and takes larger steps, so the same trained network can run in far fewer steps.",
    "measured": "6 images in 0.65 s with 10 DDIM steps, 7.53 s with 200; 10 steps already gave a plausible image: pretrained DDPM on CIFAR-10, module 09.",
    "sources": [
     "Ho et al., 2020",
     "Song et al., 2021"
    ],
    "links": {
     "module": "09-diffusion",
     "explorable": "09-diffusion.html",
     "quiz": "09"
    }
   }
  },
  "a46": {
   "deeper": {
    "text": "Drop the causal mask and train the model to guess characters hidden behind a [MASK] token, with a random share hidden each time. To write, start from a line of [MASK] and fill in a few guesses per step, in any order. The number of steps trades speed against quality. Filling the surest guesses first gives more real words, and more repeats.",
    "measured": "Word score (share of real words) 0.95 at 128 steps, surest guesses first, but only 10% of 4-grams distinct: 619,904-parameter char model at six times the compute, module 33.",
    "but": "At equal compute it trailed a left-to-right twin by 0.81 nats per character.",
    "sources": [
     "Nie et al., 2025"
    ],
    "links": {
     "module": "33-text-by-denoising",
     "explorable": "33-text-by-denoising.html",
     "quiz": "33"
    }
   }
  },
  "a47": {
   "deeper": {
    "text": "SimCLR makes two views of each image by random crops, flips and colour changes. The loss asks each view to pick its partner out of all the other views in the batch, by cosine similarity. No label is used. A linear probe, a linear classifier trained on the frozen features, then measures what the encoder kept.",
    "measured": "Class probe 57.9%, against 40.1% for the same encoder with random weights and 82.5% when trained on the labels: CIFAR-10, 10,000 probe images, 250 s each, module 16.",
    "but": "A random network already reaches 40.1%, so judge each method by its gain over that floor.",
    "sources": [
     "Chen et al., 2020"
    ],
    "links": {
     "module": "16-self-supervised-and-jepa",
     "explorable": "16-self-supervised-and-jepa.html",
     "quiz": "16"
    }
   }
  },
  "a48": {
   "deeper": {
    "text": "A loss that compares two outputs of the same encoder is zero when the encoder sends every input to one point. That is collapse. A milder form keeps outputs apart but along a few directions only. Two meters help: the spread of the normalized outputs, and the effective rank, the number of directions that carry variance.",
    "measured": "Without stop-grad, spread fell from 0.16 to 0.005 and prediction loss to 0.0005 within six seconds: JEPA-style objective on CIFAR-10, module 16.",
    "but": "The collapsed run had the highest effective rank, 17.8: rank reads the shape of the tiny spread left, not its size.",
    "links": {
     "module": "16-self-supervised-and-jepa",
     "explorable": "16-self-supervised-and-jepa.html",
     "quiz": "16"
    }
   }
  },
  "a49": {
   "deeper": {
    "text": "Four guards were tried: stop the gradient through the target; use a slow moving average of the encoder as the target (EMA); add a term that keeps each output number varying; or add one that makes outputs look Gaussian (SIGReg). Each kept the outputs from shrinking to a point. They differed in what the encoder kept.",
    "measured": "Only the EMA target probed above the random floor, 44.8% against 40.1%; SIGReg spread widest (0.968) but probed 22.1%: 120 s runs on CIFAR-10, module 16.",
    "but": "Spread is not use: picked by the meters alone, the wrong runs would have won.",
    "sources": [
     "Balestriero and LeCun, 2025"
    ],
    "links": {
     "module": "16-self-supervised-and-jepa",
     "explorable": "16-self-supervised-and-jepa.html",
     "quiz": "16"
    }
   }
  },
  "a51": {
   "deeper": {
    "text": "A toy model squeezes n features into m < n dimensions and reads them back through a ReLU. When features are dense, it keeps m of them, each on its own axis, and drops the rest. When each feature is usually zero, two rarely fire together, so they can share directions and the ReLU clips most of the overlap.",
    "measured": "Features kept rose from 5 to 13 of 20, in 5 dimensions, as sparsity went from 0 to 0.999: toy model, module 12.",
    "but": "This shows a model can store more sparse features than dimensions, not that trained language models do.",
    "sources": [
     "Elhage et al., 2022"
    ],
    "links": {
     "module": "12-features-and-dictionaries",
     "explorable": "12-features-and-dictionaries.html",
     "quiz": "12"
    }
   }
  },
  "a52": {
   "deeper": {
    "text": "A sparse autoencoder rewrites each activation as a mix of a few columns from a much larger dictionary, then rebuilds the activation from them. TopK keeps the k largest codes and zeroes the rest, so k sets how many fire. The hope is that each column, called a latent, fires for one thing.",
    "formula": "z = TopK(ReLU(W_enc·(x − b_pre) + b_enc));  x′ = W_dec·z + b_pre",
    "measured": "k = 32 of 2,048 latents rebuilt 98.7% of the variance and closed 98.4% of the loss gap: block 1 MLP of module 04’s char GPT, module 12.",
    "but": "Two dictionaries that differ only in seed can share only about 30% of their features.",
    "sources": [
     "Gao et al., 2024",
     "Paulo and Belrose, 2025"
    ],
    "links": {
     "module": "12-features-and-dictionaries",
     "explorable": "12-features-and-dictionaries.html",
     "quiz": "12"
    }
   }
  },
  "a53": {
   "deeper": {
    "text": "A probe is a simple classifier, here logistic regression, trained to read one fact from a layer’s activations. A high score shows the fact is there in a form a line can read; it does not show that the model uses it. A copy of the model with random weights shows what a probe finds with no learning at all.",
    "measured": "Sentiment read at 87.4% at layer 18 and 86.0% to 88.3% after it, against 58.0% at best with random weights: SmolLM2-360M, SST-2 sentences, module 11.",
    "links": {
     "module": "11-inside-a-language-model",
     "explorable": "11-inside-a-language-model.html",
     "quiz": "11"
    }
   }
  },
  "a54": {
   "deeper": {
    "text": "Run two prompts that differ in one detail, a clean one and a corrupt one. Rerun the corrupt prompt many times, each time pasting one activation from the clean run, at one layer and one position. If the clean answer returns, that place carries the detail. Pasting the other way asks whether the model needs it there.",
    "measured": "“iffel” at layer 3 restored 0.919 of the Paris-over-Rome answer; the last token restored at most 0.11 up to layer 26, then 0.792 at layer 27: SmolLM2-360M, module 11.",
    "sources": [
     "Heimersheim and Nanda, 2024"
    ],
    "links": {
     "module": "11-inside-a-language-model",
     "explorable": "11-inside-a-language-model.html",
     "quiz": "11"
    }
   }
  },
  "a55": {
   "deeper": {
    "text": "A steering vector is a direction added to the model’s state at one layer while it writes. The plainest kind is the mean state on positive sentences minus the mean on negative ones. A scale sets its strength. A random direction of the same size is the control.",
    "measured": "Mean P(positive) 0.52 plain, 0.81 at ×2, 1.00 at ×4, 0.38 for a random direction, 0.996 for a one-line prompt: SmolLM2-360M-Instruct, four requests, module 12.",
    "but": "At ×4, three of four replies left the request; the score alone missed it.",
    "links": {
     "module": "12-features-and-dictionaries",
     "explorable": "12-features-and-dictionaries.html",
     "quiz": "12"
    }
   }
  },
  "a56": {
   "deeper": {
    "text": "Some tools find tidy structure in any network, trained or not. The control is to run the same tool on a copy with random weights. In a model built so that its true units are known, dictionaries found the units of an untrained copy as well as those of the trained model.",
    "measured": "Best-match cosine (MMCS) 0.840 on the random copy, 0.802 on the trained model: SAEs on a 2-layer sparse-MLP model, three seeds, module 32.",
    "sources": [
     "Heap et al., 2025"
    ],
    "links": {
     "module": "32-is-the-explanation-real",
     "explorable": "32-is-the-explanation-real.html",
     "quiz": "32"
    }
   }
  },
  "a57": {
   "deeper": {
    "text": "CKA compares two whole layers on the same inputs. It gives 1 when one layer is a rotation and rescaling of the other, whatever the order of the neurons. Two trained networks scored high. Two untrained ones scored higher: a random ReLU layer keeps most of the input’s shape, so both look like the pixels.",
    "measured": "Hidden-layer CKA 0.93 between two trained seeds, 0.95 between two untrained ones; at the logits 0.91 against 0.51: FashionMNIST MLP, module 15.",
    "sources": [
     "Kornblith et al., 2019"
    ],
    "links": {
     "module": "15-geometry-of-representations",
     "explorable": "15-geometry-of-representations.html",
     "quiz": "15"
    }
   }
  },
  "a58": {
   "deeper": {
    "text": "Build a model whose units are known: each MLP keeps only 8 of 2,048 neurons per token, so those neurons are what it computes with. Fit a dictionary to it and ask how many true neurons it finds, by the best cosine between each neuron and any dictionary column. A neuron counts as found at cosine 0.9 or more.",
    "measured": "An SAE found 63.0% of the true neurons, a transcoder 34.9%: 2-layer sparse-MLP model on TinyStories, three seeds, module 32.",
    "but": "The paper this copies found the transcoder ahead; here it trailed, likely for lack of training.",
    "sources": [
     "Korznikov et al., 2026"
    ],
    "links": {
     "module": "32-is-the-explanation-real",
     "explorable": "32-is-the-explanation-real.html",
     "quiz": "32"
    }
   }
  },
  "a60": {
   "deeper": {
    "text": "A one-layer transformer learns (a + b) mod 97 from 30% of all pairs. It fits its training pairs within a few hundred steps, while accuracy on the other pairs stays near chance. With weight decay, test accuracy later climbs to 100%. Without it, test accuracy never leaves the floor in 20,000 steps.",
    "measured": "Train accuracy 100% at step 130; test accuracy ≥ 95% at step 5,900 with weight decay 1.0, not within 20,000 steps without: module 14.",
    "but": "One seed per run; a repeat of the same run crossed 95% at step 6,000.",
    "sources": [
     "Power et al., 2022"
    ],
    "links": {
     "module": "14-how-training-finds-a-solution",
     "explorable": "14-how-training-finds-a-solution.html",
     "quiz": "14"
    }
   }
  },
  "a61": {
   "deeper": {
    "text": "Weight decay shrinks every weight a little at each step, so weights the loss does not need fade away. Many weight settings fit the training set; decay keeps pushing toward smaller ones, which here are the ones that compute the sum. Another account blames the run without decay on logits that grow until float32 softmax rounds to exact 0s and 1s.",
    "formula": "w ← w − η·λ·w  (beside the gradient step)",
    "measured": "With decay, weight norm rose to 57.2 and fell to 32.2 as test accuracy climbed; without, it reached 80.6 and was still rising: module 14.",
    "but": "Two runs cannot prove the small-weights reading.",
    "sources": [
     "Loshchilov and Hutter, 2017",
     "Prieto et al., 2025"
    ],
    "links": {
     "module": "14-how-training-finds-a-solution",
     "explorable": "14-how-training-finds-a-solution.html",
     "quiz": "14"
    }
   }
  },
  "a62": {
   "deeper": {
    "text": "Fine-tune a Shakespeare character model on maths solutions and its loss on Shakespeare rises fast; forgetting is that rise. KL divergence measures how far two sets of next-token odds differ. Measured on the old text, it ranks the runs by forgetting almost perfectly; measured on the new text, it does not.",
    "measured": "Forgetting 1.238 nats per character after full fine-tuning, 1.229 of it by step 25: module 04’s char GPT, retrained without dropout, on GSM8K solutions, three seeds, module 29.",
    "links": {
     "module": "29-learning-new-keeping-old",
     "explorable": "29-learning-new-keeping-old.html",
     "quiz": "29"
    }
   }
  },
  "a63": {
   "deeper": {
    "text": "Replay mixes old examples into each batch while the model learns new ones: here 8 of every 32 windows came from Shakespeare. The model moved almost as far on the new text as plain fine-tuning did. Its loss on the old text rose a fifth as much.",
    "measured": "Forgetting 0.255 nats per character against 1.238 for plain fine-tuning, for a new-text loss only 0.052 worse: three seeds, module 29.",
    "links": {
     "module": "29-learning-new-keeping-old",
     "explorable": "29-learning-new-keeping-old.html",
     "quiz": "29"
    }
   }
  },
  "a65": {
   "deeper": {
    "text": "MeZO draws a random direction z from a seed, measures the loss with the weights moved a small step ε along z both ways, and takes the difference as the slope along z. It then steps along z. Because z can be redrawn from its seed, nothing extra is stored: training needs only the memory of running the model.",
    "formula": "g = (L(θ + εz) − L(θ − εz)) / 2ε;  θ ← θ − η·g·z",
    "measured": "0.0 MiB above inference against 246.4 MiB for backprop: MLP with 16 hidden layers. On SST-2, 75.7% after 2,000 steps against LoRA’s 91.5% after 300: SmolLM2-360M-Instruct, module 30.",
    "but": "Trained from scratch on FashionMNIST, MeZO reached about 70%, then diverged in every seed.",
    "sources": [
     "Malladi et al., 2023"
    ],
    "links": {
     "module": "30-learning-without-a-backward-pass",
     "explorable": "30-learning-without-a-backward-pass.html",
     "quiz": "30"
    }
   }
  },
  "a66": {
   "deeper": {
    "text": "Attention keeps every past token’s keys and values, so its memory grows with the text. A recurrent layer keeps one fixed-size state and updates it at each token: decay the old state, add the new input. When the decay depends on the token, as in Mamba, the layer chooses what to keep.",
    "formula": "h_t = a_t·h_{t−1} + b_t·x_t",
    "measured": "After 4,096 tokens a GPT’s KV cache held 12,582,912 bytes; a selective state-space model held 106,400 bytes at any length: module 18.",
    "but": "It also beat the GPT in a 60 s training run, 1.575 against 1.629 nats, but one seed and one budget make that a demo.",
    "sources": [
     "Gu and Dao, 2023"
    ],
    "links": {
     "module": "18-beyond-attention",
     "explorable": "18-beyond-attention.html",
     "quiz": "18"
    }
   }
  },
  "a67": {
   "deeper": {
    "text": "A matrix memory S stores a value v under a key k and returns S·q for a query q. Plain linear attention just adds v·kᵀ. The delta rule first reads what S already returns for k and writes only the difference, so a key written twice returns its new value. That is one step of gradient descent on the error ½‖S·k − v‖².",
    "formula": "S ← S + β·(v − S·k)·kᵀ",
    "measured": "With 64 random pairs in a 32 × 32 state, the delta rule kept 0.96 of the newest 16 and 0.07 of the oldest; linear attention about 0.83 of each: module 27.",
    "but": "Over all 64 pairs, linear attention read more right, 0.83 against 0.47, against the expectation written before the run.",
    "sources": [
     "Widrow and Hoff, 1960",
     "Schlag et al., 2021"
    ],
    "links": {
     "module": "27-memory-as-a-matrix",
     "explorable": "27-memory-as-a-matrix.html",
     "quiz": "27"
    }
   }
  },
  "a69": {
   "deeper": {
    "text": "If loss falls as a power of model size N, then log loss falls along a straight line in log N, and its slope is −α. One least-squares fit in log space reads α, and the line predicts the next size up. The fitter was first checked on made-up data with a known exponent.",
    "formula": "L(N) ≈ A·N^(−α)",
    "measured": "α = 0.074 (R² 0.962) over six sizes from 50,880 to 3,159,552 parameters, at 4M tokens: character models, module 19.",
    "but": "α moved from 0.053 to 0.121 with the token budget, since no model had finished learning.",
    "sources": [
     "Kaplan et al., 2020"
    ],
    "links": {
     "module": "19-scaling-laws",
     "explorable": "19-scaling-laws.html",
     "quiz": "19"
    }
   }
  },
  "a70": {
   "deeper": {
    "text": "Training compute is about 6 operations per parameter per token. At a fixed budget, a bigger model sees fewer tokens. Plot every run’s loss against the compute it used, and the lower edge names the best size at each budget. Chinchilla found that model size and data should grow together, about 20 tokens per parameter.",
    "formula": "C ≈ 6·N·D",
    "measured": "At all 40 budgets the winner was the smallest size whose run reached it; a line through the winners has slope 0.76: module 19.",
    "but": "That staircase follows where the runs end, not a true best size.",
    "sources": [
     "Hoffmann et al., 2022"
    ],
    "links": {
     "module": "19-scaling-laws",
     "explorable": "19-scaling-laws.html",
     "quiz": "19"
    }
   }
  },
  "a71": {
   "deeper": {
    "text": "In-context learning: a trained model reads a few solved examples in its prompt and applies the pattern to a new case. No weight changes; the examples act only through attention. Part of the gain can come from showing the format and the label words, not the task.",
    "measured": "Sentiment accuracy 79.4% with no example, 88.6% with one, 84.2% with eight examples given coin-flip labels: SmolLM2-360M-Instruct, 872 SST-2 sentences, module 20.",
    "sources": [
     "Brown et al., 2020"
    ],
    "links": {
     "module": "20-in-context-learning",
     "explorable": "20-in-context-learning.html",
     "quiz": "20"
    }
   }
  },
  "a72": {
   "deeper": {
    "text": "Train a small transformer on prompts that each hold pairs (x, w·x) for a fresh random w, and ask it to guess y for a new x. Give the same pairs to classic rules: least squares, ridge, nearest neighbours, one gradient step. The net’s error falls with each pair added, far faster than one gradient step’s.",
    "measured": "Error 0.075 with 10 pairs, against 0.372 for one gradient step and 0.000 for least squares: 2-block transformer, 5-dimensional linear rules, module 20.",
    "but": "It missed all three bars set before the run and levelled off near 0.03, where least squares is exact.",
    "sources": [
     "Garg et al., 2022",
     "von Oswald et al., 2023"
    ],
    "links": {
     "module": "20-in-context-learning",
     "explorable": "20-in-context-learning.html",
     "quiz": "20"
    }
   }
  },
  "a74": {
   "deeper": {
    "text": "Asked for the answer at once, a small model must do its arithmetic inside the first tokens it writes. Asked to write its steps first, it can work on the page. The cost is tokens: about 189 per problem here, against 13.",
    "measured": "15.0% answer only, 61.5% with written steps: Qwen3-1.7B at 4 bits, first 200 GSM8K problems, greedy, module 22.",
    "sources": [
     "Wei et al., 2022"
    ],
    "links": {
     "module": "22-reasoning-at-test-time",
     "explorable": "22-reasoning-at-test-time.html",
     "quiz": "22"
    }
   }
  },
  "a75": {
   "deeper": {
    "text": "Sample several chains at a temperature above 0 and take the answer most of them reach. Wrong chains tend to end at different numbers; right ones end at the same number. The share of problems where any sample is right sets a ceiling for every way of choosing.",
    "measured": "One sample 61.1%, majority of 8 69.5%, any of 8 right 80.0%: Qwen3-1.7B at 4 bits, 200 GSM8K problems, module 22.",
    "but": "Asked to grade the samples, the same model said Yes to 1,587 of 1,600; only its odds still ranked right above wrong, 82% of the time.",
    "sources": [
     "Wang et al., 2022"

    "links": {
     "module": "22-reasoning-at-test-time",
     "explorable": "22-reasoning-at-test-time.html",
     "quiz": "22"
    }
   }
  },
  "a76": {
   "deeper": {
    "text": "Treat the instruction as the parameter of a frozen model. A program scores the answers on 60 training questions, with no luck in it. Another language model proposes instructions: APE writes them from examples, OPRO reads its own score history, and two other methods read the errors.",
    "measured": "Test accuracy rose from 49.0% for the baseline instruction to between 59.3% and 63.1% on average across four methods: a small Qwen3, TREC question types, 3 seeds, module 34.",
    "sources": [
     "Zhou et al., 2022",
     "Yang et al., 2023"
    ],
    "links": {
     "module": "34-prompts-as-parameters",
     "explorable": "34-prompts-as-parameters.html",
     "quiz": "34"
    }
   }
  },
  "a77": {
   "deeper": {
    "text": "Choosing the best of 30 to 40 instructions on 60 questions picks partly for luck: the winner tends to have been lucky by a few points. A held-out split from the same source shows how much. A test set with another mix of question types can tell a different story.",
    "measured": "Chosen instructions scored 8.4 to 10.1 points higher on train than on held-out questions, against 4.7 for the baseline: module 34.",
    "but": "On test, two runs near the top on held-out got only 9% and 25% of description questions right.",
    "links": {
     "module": "34-prompts-as-parameters",
     "explorable": "34-prompts-as-parameters.html",
     "quiz": "34"
    }
   }
  },
  "a78": {
   "deeper": {
    "text": "Retrieval scores every passage against the question and pastes the best into the prompt before the model answers. BM25 scores by shared words: rare words count more, each repeat counts less, and long passages need more matches. Giving the model the right paragraph sets a ceiling, so errors split cleanly into finding and reading.",
    "formula": "idf(t) = ln(1 + (N − df + 0.5) / (df + 0.5))",
    "measured": "Exact match 4.5% with no passage, 29.0% with BM25’s top paragraph, 37.0% with the right one: SmolLM2-360M-Instruct, 200 SQuAD questions, module 21.",
    "links": {
     "module": "21-retrieval-and-memory",
     "explorable": "21-retrieval-and-memory.html",
     "quiz": "21"
    }
   }
  },
  "a79": {
   "deeper": {
    "text": "A neural retriever turns the question and each passage into vectors and ranks passages by cosine. On SQuAD, plain word matching found the right paragraph first more often. SQuAD’s writers read the paragraph before writing each question, so their questions may share more of its words.",
    "measured": "Right paragraph ranked first for 75.5% of 10,570 questions with BM25, 62.5% with MiniLM vectors: SQuAD validation, module 21.",
    "but": "This runs against the common story, and this run tests none of the reasons offered for it.",
    "sources": [
     "Karpukhin et al., 2020"
    ],
    "links": {
     "module": "21-retrieval-and-memory",
     "explorable": "21-retrieval-and-memory.html",
     "quiz": "21"
    }
   }
  },
  "a81": {
   "deeper": {
    "text": "Rounding to 4 bits gives each weight one of 16 levels between a low and a high value. With one scale per row, one large weight stretches the levels and leaves few near zero, where most weights sit. A scale per group of 64 weights costs half a bit more per weight and fixes most of it.",
    "formula": "q = round((w − b)/s) in 0..15;  w′ = q·s + b",
    "measured": "Perplexity 16.07 untouched, 36.15 at 4 bits per row, 19.94 at 4 bits per group of 64: SmolLM2-360M-Instruct, module 23.",
    "links": {
     "module": "23-compression",
     "explorable": "23-compression.html",
     "quiz": "23"
    }
   }
  },
  "a82": {
   "deeper": {
    "text": "BitNet b1.58 rounds every weight to −1, 0 or 1, times one scale per matrix, during training. Rounding has no useful slope, so the backward pass treats it as if it were not there and updates hidden float weights; only the codes ship. The model learns weights that survive the rounding.",
    "formula": "code = clamp(round(W/g), −1, 1),  g = mean|W|",
    "measured": "Held-out loss 1.617 nats per character for ternary against 1.648 for the best rounded 4-bit model, both 1.5 MB: char GPTs, module 28.",
    "but": "Most of the planned 0.168 lead came from a poorly tuned baseline: tuning one shape took away 0.137 of it.",
    "sources": [
     "Ma et al., 2024",
     "Bengio et al., 2013"
    ],
    "links": {
     "module": "28-fewer-bits-trained-in",
     "explorable": "28-fewer-bits-trained-in.html",
     "quiz": "28"
    }
   }
  },
  "a83": {
   "deeper": {
    "text": "Magnitude pruning sets to zero the weights nearest zero, the same share in every matrix. A control zeroes the same number at random places. Zeroed weights save nothing on their own: the matrices keep their shape.",
    "measured": "Perplexity 16.07 untouched, 16.41 with the smallest 10% zeroed, 714.8 with a random 10%, 1,485.5 with the smallest 50%: SmolLM2-360M-Instruct, module 23.",
    "links": {
     "module": "23-compression",
     "explorable": "23-compression.html",
     "quiz": "23"
    }
   }
  },
  "a85": {
   "deeper": {
    "text": "Regret counts the wins lost against always pulling the best lever. ε-greedy explores at a fixed rate forever. UCB1 adds a bonus to levers pulled rarely. Thompson sampling keeps a belief about each lever’s odds, draws a guess from each, and pulls the best guess.",
    "formula": "UCB1: argmax  mean + √(2 ln t / n)",
    "measured": "Median regret after 10,000 pulls: Thompson 43, UCB1 228, ε-greedy 237, random 2,207; five arms, 20 seeds, module 24.",
    "sources": [
     "Thompson, 1933",
     "Auer et al., 2002"
    ],
    "links": {
     "module": "24-reinforcement-learning",
     "explorable": "24-reinforcement-learning.html",
     "quiz": "24"
    }
   }
  },
  "a86": {
   "deeper": {
    "text": "A policy network gives the probability of each action. REINFORCE plays one episode, then raises the log-probability of each action taken in proportion to the return that followed it, the discounted sum of later rewards. Subtracting the episode’s mean return and dividing by its spread makes below-average actions less likely.",
    "formula": "loss = −Σₜ log π(aₜ|sₜ)·(Gₜ − mean G) / std G",
    "measured": "All three seeds reached a 500-step episode within 13,684 steps; two ended holding the pole for all 500: CartPole, module 24.",
    "but": "Seed 0 fell back to about 121 steps: one bad update can undo a good policy.",
    "sources": [
     "Williams, 1992"
    ],
    "links": {
     "module": "24-reinforcement-learning",
     "explorable": "24-reinforcement-learning.html",
     "quiz": "24"
    }
   }
  },
  "a87": {
   "deeper": {
    "text": "PPO reuses each batch for several updates. To keep the new policy near the old one, it clips ρ, the ratio of new to old probability, to [0.8, 1.2], so an update gains nothing by pushing further. A second network, the critic, estimates each state’s value, and A, the advantage, is how much better an action did than that.",
    "formula": "L = mean(min(ρ·A, clip(ρ, 0.8, 1.2)·A))",
    "measured": "At rate 2.5 × 10⁻³, all three clipped seeds ended at 500; unclipped, they ended at 9.1, 190.1 and 108.9: CartPole, module 24.",
    "sources": [
     "Schulman et al., 2017"
    ],
    "links": {
     "module": "24-reinforcement-learning",
     "explorable": "24-reinforcement-learning.html",
     "quiz": "24"
    }
   }
  },
  "a88": {
   "deeper": {
    "text": "A world model predicts what follows an action: here, the next cell of an agent on a grid with walls. Fed its own predictions, it can imagine several steps ahead. Its errors pile up with each imagined step.",
    "measured": "Next cell right 92.5% of the time after one imagined step and 73.9% after eight, against 31.2% and 12.8% for “did not move”: grid arenas, module 25.",
    "sources": [
     "Ha and Schmidhuber, 2018"
    ],
    "links": {
     "module": "25-world-models-and-planning",
     "explorable": "25-world-models-and-planning.html",
     "quiz": "25"
    }
   }
  },
  "a89": {
   "deeper": {
    "text": "Random shooting draws 64 sequences of 8 random moves, imagines each in the model, and scores each by its distance to the goal. The agent takes the first move of the best sequence, then plans again from where it lands. Planning again at every step is called model-predictive control.",
    "measured": "Goals reached within 20 steps: 75.7% with the learned model, 89.0% with the true world as the model, 3.7% with random moves; 300 test arenas, module 25.",
    "but": "A JEPA world model reached a loss of 3 × 10⁻⁶ yet planned no better than random, 3.7%: its latent held no linear trace of where the agent was.",
    "sources": [
     "Hafner et al., 2019"
    ],
    "links": {
     "module": "25-world-models-and-planning",
     "explorable": "25-world-models-and-planning.html",
     "quiz": "25"
    }
   }
  },
  "a90": {
   "deeper": {
    "text": "For each question, sample a group of 8 replies and mark each right or wrong with a checker program. A reply’s advantage is its reward minus the group’s mean; GRPO also divides by the group’s spread. Replies above the mean become likelier, those below less likely. A group where all 8 score the same teaches nothing.",
    "formula": "Aᵢ = (rᵢ − mean r) / std r",
    "measured": "Right on the first try (pass@1) 59.1% → 94.9% after 300 steps with Dr. GRPO; worked-style replies rose from 24.7% to over 98%: char model on 3-digit sums, module 26.",
    "sources": [
     "Shao et al., 2024",
     "Liu et al., 2025"
    ],
    "links": {
     "module": "26-rl-with-a-checker",
     "explorable": "26-rl-with-a-checker.html",
     "quiz": "26"
    }
   }
  },
  "a91": {
   "deeper": {
    "text": "Replace the checker with a coin that hands out as many 1s as the checker would, but at random. Each update then pushes in a random direction, and nothing pulls the model back toward where it started. The damage feeds itself: as the model gets worse, more groups score all 0.",
    "measured": "Pass@1 fell from 59.1% to 4.6% with GRPO and to 2.4% with PPO’s clip: coin-flip rewards, char model on 3-digit sums, module 26.",
    "but": "One published run lifted a Qwen2.5 maths model 21.4 points with random rewards; other model families did not gain.",
    "links": {
     "module": "26-rl-with-a-checker",
     "explorable": "26-rl-with-a-checker.html",
     "quiz": "26"
    }
   }
  },
  "a92": {
   "deeper": {
    "text": "A language model rewrites a short program: here, a rule that picks a bin for each item in online bin packing. A sandbox runs each version and counts the bins. Versions that score well become the parents shown in later prompts. The model’s weights never change.",
    "measured": "Kept programs beat best fit by 0.35 ± 0.30 points on held-out instances, in 2 of 3 seeds, at 400 candidates: a 4B model on a laptop, module 35.",
    "but": "Random search over one-line formulas, with the same checker, came near.",
    "sources": [
     "Romera-Paredes et al., 2024",
     "Novikov et al., 2025"
    ],
    "links": {
     "module": "35-evolution-with-an-llm-mutator",
     "explorable": "35-evolution-with-an-llm-mutator.html",
     "quiz": "35"
    }
   }
  },
  "a93": {
   "deeper": {
    "text": "Remove the checker and accept every child untested. Asked each time for a better version, the model raised its own numbers: a power of 12, then 400, then 10,000, until the scores overflowed. One run wrote a better rule along the way, and the next child replaced it.",
    "measured": "Best child 4.345% above the lower bound, against best fit’s 4.781%, then lost; every child failed from child 281: no-checker run, seed 1, module 35.",
    "links": {
     "module": "35-evolution-with-an-llm-mutator",
     "explorable": "35-evolution-with-an-llm-mutator.html",
     "quiz": "35"
    }
   }
  },
  "a97": {
   "deeper": {
    "text": "Write stored patterns as the rows of X, and take a probe ξ. A modern Hopfield network scores each pattern against the probe, takes a softmax, and blends the patterns. That is attention, with the probe as query and the patterns as keys and values; β plays the part of 1/√d.",
    "formula": "ξ_new = Xᵀ·softmax(β·X·ξ)",
    "measured": "100 neurons, 20% of bits flipped: one softmax step recalled all of 10,000 stored patterns; with 20 stored, the classic rule recalled 20% of them. Module 00c.",
    "sources": [
     "Hopfield, 1982",
     "Ramsauer et al., 2020"
    ],
    "links": {
     "module": "00c-kernels-hopfield",
     "explorable": "00c-double-descent.html",
     "quiz": "00c"
    }
   }
  },
  "n1": {
   "title": "Fit every point exactly",
   "body": "Give a curve as many coefficients as there are points and it passes through every one. Training error drops to zero.",
   "deeper": {
    "text": "A polynomial of degree d has d + 1 coefficients. With as many coefficients as data points, one polynomial passes through every point, and training error is zero. Zero training error says nothing about the points in between.",
    "measured": "Training error 2.07e−18 at degree 19 on 20 noisy samples of sin(3x) + 0.35x: minimum-norm polynomial fits, module 00c.",
    "links": {
     "module": "00c-kernels-hopfield",
     "explorable": "00c-double-descent.html",
     "quiz": "00c"
    }
   }
  },
  "n2": {
   "title": "Then miss the new ones",
   "body": "Between the points the curve swings wildly. Fresh points from the same source land far from it."
  },
  "n3": {
   "title": "Two curves tell it",
   "body": "Training loss keeps falling. Loss on held-back data falls, then turns up. The gap between them is overfitting.",
   "deeper": {
    "text": "Hold back part of the data as a validation set and score it after every epoch. Training loss keeps falling, because the model sees those same examples again and again. Validation loss falls while the model learns patterns that carry over, then rises once it learns details of the training images.",
    "measured": "After 25 epochs, train loss 0.216 and validation loss 0.411: 784 → 256 → 10 network on 18,000 FashionMNIST images, module 02.",
    "links": {
     "module": "02-neural-networks",
     "explorable": "02-nn-playground.html",
     "quiz": "02"
    }
   }
  },
  "n4": {
   "title": "Stop at the bottom",
   "body": "Keep the weights from the epoch with the lowest validation loss. In one run that was epoch <b>17<\/b> of 25.",
   "deeper": {
    "text": "Early stopping keeps the weights from the epoch with the lowest validation loss and stops there. It needs no change to the model, only a held-out set scored as training runs. The choice is made on validation data, so the test set still gives a fair final number.",
    "measured": "Validation loss lowest at epoch 17 (0.360, accuracy 0.877) while train loss kept falling to 0.216: NumPy MLP on FashionMNIST, module 02.",
    "but": "The module did not stop early: its 0.8646 test accuracy comes from the epoch-25 weights.",
    "links": {
     "module": "02-neural-networks",
     "explorable": "02-nn-playground.html",
     "quiz": "02"
    }
   }
  },
  "n5": {
   "title": "Or keep the weights small",
   "body": "Add a penalty on the size of the weights. Wild swings now cost too much, and the curve smooths.",
   "deeper": {
    "text": "Ridge regression adds λ times the squared size of the weights to the loss. Large coefficients that cancel each other now cost more than they gain, so the fit picks smaller ones. Weight decay does the same inside gradient descent.",
    "formula": "(XᵀX + λI)·w = Xᵀy",
    "measured": "With a near-copy of one feature, coefficients of +21.5 and −19.9 fell to about +0.83 each, while training error moved from 0.31956 to 0.32029: module 00a, exercise 2.",
    "links": {
     "module": "00a-perceptron",
     "quiz": "00a"
    }
   }
  },
  "n6": {
   "title": "The textbook U",
   "body": "Too simple misses the shape; too flexible chases the noise. Test error is lowest in between.",
   "deeper": {
    "text": "Average a model’s test error over many fresh datasets and it splits in two. Bias² measures how wrong the average fit is; it falls as the model grows. Variance measures how much the fit moves when the data changes; it rises. Their sum is lowest at a middle size.",
    "formula": "test error = bias² + variance + noise",
    "measured": "Lowest at degree 3: bias² 0.0032 + variance 0.0088 = 0.0120; polynomials on 20 points, averaged over 300 datasets, module 00c.",
    "links": {
     "module": "00c-kernels-hopfield",
     "explorable": "00c-double-descent.html",
     "quiz": "00c"
    }
   }
  },
  "n7": {
   "title": "Past the peak, error falls again",
   "body": "Where parameters equal data points, test error spikes. Add still more parameters and it falls again.",
   "deeper": {
    "text": "At degree 19 a polynomial has 20 coefficients, one per data point, and exactly one curve fits them all; to pass through every noisy point it needs huge coefficients. Past that, infinitely many curves fit, the fitter can pick a calm one, and test error falls again. This is double descent.",
    "measured": "Test error 0.0183 at degree 3, 1.11e+12 at degree 19, 3.019 at degree 30: one dataset of 20 points, module 00c.",
    "sources": [
     "Belkin et al., 2019",
     "Nakkiran et al., 2019"
    ],
    "links": {
     "module": "00c-kernels-hopfield",
     "explorable": "00c-double-descent.html",
     "quiz": "00c"
    }
   }
  },
  "n8": {
   "title": "Of all perfect fits, the smallest",
