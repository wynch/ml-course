name: Course CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the dependency-free reader
        run: python3 scripts/build_reader.py
      - name: Verify the offline reader
        run: python3 scripts/check_offline.py --pack reader
      - name: Check the model house page carries its current data
        run: python3 palace/tools/build_page.py --check
      - name: Check the model house plan is valid and current
        run: python3 palace/tools/build_palace.py --check
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Install Playwright and Chromium for the model house tests
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.64.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Walk the model house in a headless browser
        env:
          PLAYWRIGHT: ${{ runner.temp }}/pw/node_modules/playwright
        run: node palace/tools/test_palace.js
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - name: Check every architecture record passes and the explorer holds them all
        run: uv run architectures/build.py --check
      - name: Check the planned model list agrees with the records
        run: uv run --with jsonschema python -I architectures/validate.py
      - name: Test the data and evaluation lab
        working-directory: modules/05a-data-evaluation/python
        run: uv run --frozen pytest -q
