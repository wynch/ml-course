name: Pages

# The published site is the repository tree plus reader/, which is a build
# output and therefore gitignored. Building it here keeps the offline reader in
# step with the modules on every push instead of depending on a local run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the dependency-free reader
        run: python3 scripts/build_reader.py

      - name: Verify the offline reader
        run: python3 scripts/check_offline.py --pack reader

      - name: Assemble the site
        run: |
          rsync -a --exclude=.git --exclude=_site --exclude=dist ./ _site/
          test -f _site/.nojekyll
          test -f _site/reader/index.html
          test -f _site/explorables/index.html
          du -sh _site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
