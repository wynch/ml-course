[project]
name = "mlcourse-32-is-the-explanation-real"
version = "0.1.0"
description = "Module 32 — Is the explanation real? Controls for interpretability: a model with known neurons, a random-weight copy, a second seed, an attribution graph checked by ablation, and SAELens on trained and random GPT-2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "sae-lens>=6,<7",
    "scipy>=1.14",
    "torch>=2.13.0",
    "transformer-lens==3.9.*",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
