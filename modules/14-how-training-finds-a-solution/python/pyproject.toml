[project]
name = "mlcourse-14-how-training-finds-a-solution"
version = "0.1.0"
description = "Module 14 — How training finds a solution: optimisers on toy losses and on an MLP, learning-rate schedules, loss-landscape slices and sharpness, grokking."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10",
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pillow>=12.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
