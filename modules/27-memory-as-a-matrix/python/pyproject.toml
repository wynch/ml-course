[project]
name = "mlcourse-27-memory-as-a-matrix"
version = "0.1.0"
description = "Module 27 — Memory as a matrix: linear attention, DeltaNet and Gated DeltaNet from scratch, recall on MQAR against state size, then Qwen3.5-0.8B against Qwen3-0.6B on MLX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx-lm>=0.31",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
