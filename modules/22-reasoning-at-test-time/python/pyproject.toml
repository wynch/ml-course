[project]
name = "mlcourse-22-reasoning-at-test-time"
version = "0.1.0"
description = "Module 22 — Reasoning at test time: chain of thought, self-consistency and best-of-n on GSM8K with Qwen3-1.7B (4-bit, MLX)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx-lm>=0.31",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
