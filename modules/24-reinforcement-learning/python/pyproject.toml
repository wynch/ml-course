[project]
name = "mlcourse-24-reinforcement-learning"
version = "0.1.0"
description = "Module 24 — Reinforcement learning: bandits, tabular Q-learning, REINFORCE and PPO on a hand-written CartPole."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
