[project]
name = "mlcourse-25-world-models-planning"
version = "0.1.0"
description = "Module 25 — World models and planning: an 8x8 grid world, a one-hot next-state model and a JEPA latent model of it, and random-shooting planning in each."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
