[project]
name = "mlcourse-15-geometry-of-representations"
version = "0.1.0"
description = "Module 15 — Geometry of representations: linear regions of a ReLU net, intrinsic dimension, the manifold picture, and CKA between networks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pillow>=12.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
