[project]
name = "mlcourse-10-agents"
version = "0.1.0"
description = "Module 10 — Agents: models that act. A hand-rolled ReAct loop and smolagents CodeAgent driven by a LOCAL SmolLM2, with an observability/eval mini-lab and a Gradio playground."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "smolagents>=1.19.0",
    "transformers>=5.14.1",
    "torch>=2.6.0",
    "accelerate>=1.0.0",
    "gradio>=6.20.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "../solutions"]
addopts = "-q"
