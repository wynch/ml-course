[project]
name = "mlcourse-05a-data-evaluation"
version = "0.1.0"
description = "From-scratch metrics, calibration, leakage checks, and evaluation cards."
readme = "../README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src", "solutions"]
addopts = "-q"
