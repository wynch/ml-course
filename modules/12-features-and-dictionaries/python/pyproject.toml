[project]
name = "mlcourse-12-features-dictionaries"
version = "0.1.0"
description = "Module 12 — Features and dictionaries: toy superposition, a sparse autoencoder from scratch, a pretrained SAE on GPT-2 small, and steering."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "sae-lens>=6,<7",
    "torch>=2.13.0",
    "transformer-lens==3.9.*",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
