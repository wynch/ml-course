[project]
name = "mlcourse-16-self-supervised-jepa"
version = "0.1.0"
description = "Module 16 — Self-supervised learning and JEPA: SimCLR, masked reconstruction and a small I-JEPA on one CNN, collapse and its cures, and a DINOv2 probe."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
