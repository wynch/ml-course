[project]
name = "mlcourse-11-inside-lm"
version = "0.1.0"
description = "Module 11 — Inside a language model: hooks, probes, patching and neuron poles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "nnsight>=0.8",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
