[project]
name = "mlcourse-26-rl-with-a-checker"
version = "0.1.0"
description = "Module 26 — RL with a checker: GRPO, Dr. GRPO and RLOO by hand on a char-GPT that adds, pass@k before and after, a random-reward control; then TRL's GRPOTrainer with LoRA on SmolLM2-360M-Instruct."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "peft==0.21.2",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "transformers>=5.20.1",
    "trl==1.14.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
