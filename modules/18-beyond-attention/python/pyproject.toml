[project]
name = "mlcourse-18-beyond-attention"
version = "0.1.0"
description = "Module 18 — Beyond attention: a GRU, a diagonal linear recurrence and a selective scan against the tiny GPT, then Mamba-130M against GPT-2."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
