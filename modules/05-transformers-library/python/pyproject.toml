[project]
name = "mlcourse-05-transformers"
version = "0.1.0"
description = "Module 05 — The transformers library: anatomy of a real LLM (SmolLM2-360M)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.0",
    "gradio>=6.20.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
