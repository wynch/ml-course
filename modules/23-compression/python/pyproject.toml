[project]
name = "mlcourse-23-compression"
version = "0.1.0"
description = "Module 23 — Compression: distillation, magnitude pruning, int8 and 4-bit quantisation by hand, and MLX 4-bit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "mlx-lm>=0.32.2",
    "numpy>=2.0",
    "pytest>=9.1.1",
    "safetensors>=0.5",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
