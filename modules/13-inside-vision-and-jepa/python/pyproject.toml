[project]
name = "mlcourse-13-inside-vision-jepa"
version = "0.1.0"
description = "Module 13 — Inside vision and JEPA models: one InceptionV1 channel, feature visualisation, CLIP probes and neurons, and probes on a small JEPA encoder."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pillow>=11",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torch-lucent>=0.1.8",
    "torchvision>=0.29",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"

[tool.uv]
package = false
