[project]
name = "mlcourse-21-retrieval-and-memory"
version = "0.1.0"
description = "Module 21 — Retrieval and memory: embeddings, BM25 and an inverted index by hand, and a RAG loop on SQuAD."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
