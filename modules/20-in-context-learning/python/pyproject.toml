[project]
name = "mlcourse-20-in-context-learning"
version = "0.1.0"
description = "Module 20 — In-context learning: a small transformer that learns linear regression from its prompt, against least squares; a gradient-step reading; few-shot SST-2 on SmolLM2-360M-Instruct."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.0",
    "pyarrow>=20.0",
    "pytest>=9.1.1",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
