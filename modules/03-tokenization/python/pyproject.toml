[project]
name = "mlcourse-03-tokenization"
version = "0.1.0"
description = "Module 03 — Tokenization: byte-level BPE from scratch (Python + Zig) to SmolLM3."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.20.0",
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "tokenizers>=0.22.2",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
