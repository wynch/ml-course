[project]
name = "mlcourse-08-vision"
version = "0.1.0"
description = "Module 08 — Vision: from convolutions to Vision Transformers (numpy conv, ViT anatomy, attention maps, fine-tuning, CLIP zero-shot)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.0",
    "matplotlib>=3.11.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../solutions"]
addopts = "-q"
markers = [
    "slow: tests that download data and/or train a model (deselect with -m 'not slow')",
]
