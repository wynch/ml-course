<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fog Golf — ml-course game</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root{
    --paper:#f6f8f7; --ink:#1c2422; --panel:#ffffff; --panel-2:#eef2f0;
    --line:#d5ddda; --muted:#5d6b67; --accent:#1f918d;
    --t1:#453781; --t2:#1f918d; --t3:#3fa34d; --t4:#b8336a; --t5:#1d6fb8; --t9:#4f6272;
    --you:#b8336a; --ucb:#eb6834; --ts:#1baf7a;
    --fog:#e3e9e6; --sky:#eaf0ee; --ground:#3fa34d; --ground-2:#2c7a39; --cup:#1c2422;
    --shadow:0 1px 2px rgba(20,40,35,.06), 0 6px 18px rgba(20,40,35,.05);
    --mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --display:"Avenir Next","Helvetica Neue",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121816; --ink:#e8eeec; --panel:#1a2320; --panel-2:#222d29;
      --line:#31403b; --muted:#9dada8; --accent:#37b3ae; --t4:#e0679a; --t5:#5aa1e6; --t9:#93a8b8;
      --you:#e0679a; --ucb:#d95926; --ts:#199e70;
      --fog:#26322e; --sky:#1d2724; --ground:#2f7d3b; --ground-2:#1f5a29; --cup:#070a09;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 48px}

  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}
  header.top h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  .pill{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.02em;
    padding:3px 10px;border-radius:999px;color:#fff;background:var(--t9);white-space:nowrap}
  @media (prefers-color-scheme: dark){ .pill{color:#121816} }
  .top .spacer{flex:1}
  .backlink{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;display:inline-flex;align-items:center;min-height:44px}
  .backlink:hover{color:var(--accent);border-bottom-color:var(--accent)}

  .levels{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
  .lv{font-family:var(--display);font-weight:600;font-size:15px;min-width:44px;height:44px;border-radius:12px;
    border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;position:relative}
  .lv[aria-current="true"]{border-color:var(--accent);background:var(--accent);color:#fff}
  .lv:disabled{opacity:.4;cursor:default}
  .lv.done::after{content:"";position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%;background:var(--ts)}
  .lv[aria-current="true"].done::after{background:#fff}
  .levels .spacer{flex:1}
  .sound{font-family:var(--display);font-size:12px;font-weight:600;height:44px;padding:0 14px;border-radius:999px;
    border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
  .sound[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

  .goal{font-family:var(--display);font-size:16px;font-weight:600;margin:0 0 10px;min-height:24px}
  .goal small{display:block;font-family:var(--body);font-weight:400;font-size:12.5px;color:var(--muted)}

  .stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;border:1px solid var(--line);
    background:var(--sky);box-shadow:var(--shadow);touch-action:manipulation}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%}
  .toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:calc(100% - 20px);
    font-size:13px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;
    padding:6px 12px;box-shadow:var(--shadow);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.on{opacity:1}

  .hud{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
  .chip{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;color:var(--muted)}
  .chip b{color:var(--ink);font-weight:600}

  .controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
  .knob{display:grid;grid-template-columns:auto 44px minmax(0,1fr) 44px;gap:6px;align-items:center}
  .knob label{font-family:var(--display);font-size:13px;font-weight:600;min-width:96px}
  .knob label b{font-family:var(--mono);font-weight:600;color:var(--you);display:block;font-size:15px}
  .knob.mom label b{color:var(--t5)}
  .nudge{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel-2);
    color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
  input[type=range]{width:100%;height:44px;margin:0;accent-color:var(--you);background:transparent}
  .knob.mom input[type=range]{accent-color:var(--t5)}
  .knobs{display:grid;gap:8px}
  .actions{display:flex;flex-direction:column;gap:8px}
  .hit{font-family:var(--display);font-size:17px;font-weight:700;min-width:110px;height:56px;border-radius:14px;border:0;
    background:var(--you);color:#fff;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .hit:active{transform:translateY(1px)}
  .hit:disabled{opacity:.45;cursor:default}
  .retry{font-family:var(--display);font-size:14px;font-weight:600;height:44px;border-radius:12px;border:1.5px solid var(--line);
    background:transparent;color:var(--ink);cursor:pointer}
  .retry.pulse{border-color:var(--you);color:var(--you);animation:pulse 1s ease-in-out infinite}
  @keyframes pulse{50%{transform:scale(1.05)}}
  @media (max-width:560px){
    .controls{grid-template-columns:minmax(0,1fr)}
    .actions{flex-direction:row}
    .actions .hit{flex:2}
    .actions .retry{flex:1;height:56px}
    .knob label{min-width:78px;font-size:12px}
  }
  button,input{touch-action:manipulation}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .keys{font-size:12px;color:var(--muted);margin:10px 0 0}
  .keys kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--panel-2)}

  .veil{position:fixed;inset:0;background:rgba(10,16,14,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
  .veil.on{display:flex}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 18px 16px;max-width:440px;width:100%;animation:rise .35s ease-out}
  @keyframes rise{from{transform:translateY(16px);opacity:0}}
  .card .tag{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ts);margin:0 0 2px}
  .card h2{font-family:var(--display);font-size:18px;margin:0 0 8px}
  .card p{margin:0 0 10px;font-size:15px}
  .card p b{color:var(--accent)}
  .card .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .card .row button{font-family:var(--display);font-weight:600;font-size:14px;height:44px;padding:0 16px;border-radius:12px;cursor:pointer;
    border:1.5px solid var(--line);background:transparent;color:var(--ink)}
  .card .row button.go{background:var(--accent);border-color:var(--accent);color:#fff}
</style>

<div class="wrap">
<header class="top">
  <h1>Fog Golf</h1>
  <span class="pill">Game 1</span>
  <span class="spacer"></span>
  <a class="backlink" href="index.html">← All games</a>
</header>

<div class="levels" id="levels"></div>
<p class="goal" id="goal"></p>

<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div class="toast" id="toast"></div>
</div>

<div class="hud" id="hud"></div>

<div class="controls">
  <div class="knobs">
    <div class="knob">
      <label for="power">power <b id="powerv">0.05</b></label>
      <button class="nudge" id="pdown" aria-label="less power">−</button>
      <input type="range" id="power" min="0" max="1000" step="1">
      <button class="nudge" id="pup" aria-label="more power">+</button>
    </div>
    <div class="knob mom" id="momrow" hidden>
      <label for="mom">keep rolling <b id="momv">0.00</b></label>
      <button class="nudge" id="mdown" aria-label="less rolling">−</button>
      <input type="range" id="mom" min="0" max="95" step="5" value="0">
      <button class="nudge" id="mup" aria-label="more rolling">+</button>
    </div>
  </div>
  <div class="actions">
    <button class="hit" id="hit">Hit</button>
    <button class="retry" id="retry">Retry</button>
  </div>
</div>
<p class="keys"><kbd>Space</kbd> hit · <kbd>R</kbd> retry · <kbd>↑</kbd><kbd>↓</kbd> power</p>
</div>

<div class="veil" id="veil" role="dialog" aria-modal="true" aria-labelledby="cardh">
  <div class="card">
    <p class="tag" id="cardtag">Sunk</p>
    <h2 id="cardh">What you just did</h2>
    <div id="cardbody"></div>
    <div class="row">
      <button id="again">Play again</button>
      <button class="go" id="next">Next level</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ---------- pure maths (tested in node) ----------
const H = 1e-5;
const PMIN = 0.01, PMAX = 30;           // power slider range, log scale
const AUTO_SHOTS = 50;

function heightAt(L, p){ return L.dim === 1 ? L.f(p) : L.f(p[0], p[1]); }
// Central-difference slope of the course: the true gradient to ~1e-9.
function grad(L, p){
  const f = L.f;
  if (L.dim === 1) return (f(p + H) - f(p - H)) / (2 * H);
  return [(f(p[0] + H, p[1]) - f(p[0] - H, p[1])) / (2 * H),
          (f(p[0], p[1] + H) - f(p[0], p[1] - H)) / (2 * H)];
}
// One shot. Heavy-ball rule: vel = beta*vel - power*slope; pos += vel. beta = 0 is plain gradient descent.
function step(L, pos, vel, power, beta){
  const g = grad(L, pos);
  if (L.dim === 1){ const v = beta * vel - power * g; return {pos: pos + v, vel: v, g}; }
  const v = [beta * vel[0] - power * g[0], beta * vel[1] - power * g[1]];
  return {pos: [pos[0] + v[0], pos[1] + v[1]], vel: v, g};
}
function dist(L, a, b){ return L.dim === 1 ? Math.abs(a - b) : Math.hypot(a[0] - b[0], a[1] - b[1]); }
function finitePos(L, p){ return L.dim === 1 ? Number.isFinite(p) : Number.isFinite(p[0]) && Number.isFinite(p[1]); }
function outOfBounds(L, p){
  const V = L.view;
  if (!finitePos(L, p)) return true;
  if (L.dim === 1){
    if (p < V.x0 || p > V.x1) return true;
    return L.f(p) > V.y1 + 0.1 * (V.y1 - V.y0);
  }
  const mx = 0.08 * (V.x1 - V.x0), my = 0.08 * (V.y1 - V.y0);
  return p[0] < V.x0 - mx || p[0] > V.x1 + mx || p[1] < V.y0 - my || p[1] > V.y1 + my;
}
// After a shot: 'lost' | 'won' | 'out' (no shots left) | 'stuck' (resting in a trap, not terminal) | 'play'
function judge(L, pos, shots){
  if (outOfBounds(L, pos)) return 'lost';
  if (dist(L, pos, L.target) < L.tol) return 'won';
  if (shots >= L.max) return 'out';
  if (L.trap && dist(L, pos, L.trap) < L.trapTol) return 'stuck';
  return 'play';
}
// Autopilot: the same rule for every shot; judged where it ends.
function autopilot(L, power, beta, n){
  n = n || AUTO_SHOTS;
  let pos = L.start, vel = L.dim === 1 ? 0 : [0, 0];
  const path = [pos];
  for (let i = 0; i < n; i++){
    const s = step(L, pos, vel, power, beta);
    pos = s.pos; vel = s.vel; path.push(pos);
    if (outOfBounds(L, pos)) return {path, result: 'lost', end: pos};
  }
  let result = dist(L, pos, L.target) < L.tol ? 'won'
             : (L.trap && dist(L, pos, L.trap) < L.trapTol) ? 'stuck' : 'short';
  return {path, result, end: pos};
}
// Find the bottom near a guess by many small plain steps.
function settle(L, guess, lr, n){
  let p = guess, v = L.dim === 1 ? 0 : [0, 0];
  for (let i = 0; i < n; i++){ const s = step(L, p, v, lr, 0); p = s.pos; v = L.dim === 1 ? 0 : [0, 0]; }
  return p;
}
function powerFromSlider(v){ return PMIN * Math.pow(PMAX / PMIN, v / 1000); }
function sliderFromPower(p){ return Math.round(1000 * Math.log(p / PMIN) / Math.log(PMAX / PMIN)); }

// ---------- courses ----------
const TH = 0.4, CT = Math.cos(TH), ST = Math.sin(TH);
const DIP = [-0.75 * CT, -0.75 * ST];
const LEVELS = [
  { name: 'The bowl', dim: 1, f: x => x * x, start: -0.8, guess: 0, tol: 0.04, max: 10,
    view: {x0: -1.2, x1: 1.2, y0: -0.15, y1: 1.35},
    goal: 'Sink it in 10 shots.', sub: 'Fog hides the ground. You feel only the slope under the ball. Set the power, then hit.',
    card: ['Each shot moved the ball by your power times the slope under it. Too soft and it crept; too hard and it jumped past the bottom and back.',
           'Walking downhill by slope times a step size is <b>gradient descent</b> (gradient means slope). Your power is its <b>learning rate</b>.'] },
  { name: 'The gully', dim: 1, f: x => 8 * x * x, start: -0.33, guess: 0, tol: 0.03, max: 10,
    view: {x0: -1.2, x1: 1.2, y0: -0.15, y1: 1.35},
    goal: 'A steeper bowl. Sink it in 10 shots.', sub: 'Your power carries over from the last hole.',
    card: ['Power that worked in the wide bowl threw the ball out here. Steep walls mean a big slope, so each miss landed farther out than the last.',
           'That runaway is <b>divergence</b>: a learning rate too big for the valley. Steep valleys need small steps.'] },
  { name: 'The flats', dim: 1,
    f: x => 0.45 - 0.03 * x - 0.4 * Math.exp(-((x - 1) ** 2) / (2 * 0.18 * 0.18)) + (x > 1.35 ? 3 * (x - 1.35) ** 2 : 0),
    start: -1.45, guess: 1, tol: 0.04, max: 12,
    view: {x0: -1.6, x1: 1.6, y0: -0.08, y1: 0.78},
    goal: 'Cross the flats and sink it in 12 shots.', sub: 'Watch how far each shot moves.',
    card: ['On flat ground the slope is nearly zero, so a soft shot barely moved. You hit hard on the flats and soft at the hole.',
           'One power never fits the whole course. Changing the learning rate as you go is a <b>learning-rate schedule</b>.'] },
  { name: 'Two holes', dim: 1, f: x => 0.5 * (x * x - 1) ** 2 + 0.25 * x,
    start: 1.45, guess: -1.05, trapGuess: 0.93, trapTol: 0.06, tol: 0.05, max: 10,
    view: {x0: -1.75, x1: 1.85, y0: -0.45, y1: 1.45},
    goal: 'Two holes hide here. Sink the deeper one in 10 shots.', sub: 'The height readout tells deep from shallow.',
    card: ['Once the ball rested in the shallow hole, the ground was flat all round, so no sane shot moved it. It never sees the deeper hole over the hump.',
           'A bottom that is not the lowest is a <b>local minimum</b>. Only a big early shot cleared the hump.'] },
  { name: 'The ravine', dim: 2, momentum: true,
    f: (x, y) => 0.5 * x * x + 20 * (y - 0.3 * Math.sin(1.4 * x)) ** 2,
    start: [-1.4, 0.3 * Math.sin(-1.96) + 0.3], guess: [0, 0], tol: 0.1, max: 20, pmax: 0.3,
    view: {x0: -1.6, x1: 1.6, y0: -1, y1: 1},
    goal: 'Roll down the ravine to the hole in 20 shots.', sub: 'Seen from above. New knob: keep rolling.',
    card: ['Without rolling, the ball bounced wall to wall and crept along the floor. Keep-rolling adds part of the last move to the next one.',
           'The side-to-side bounces cancel and the downhill pushes add up. That carry-over is <b>momentum</b>.'] },
  { name: 'Autopilot', dim: 2, momentum: true, auto: true,
    f: (x, y) => { const u = CT * x + ST * y, v = -ST * x + CT * y;
      return 0.5 * u * u + 20 * v * v - 0.22 * Math.exp(-((x - DIP[0]) ** 2 + (y - DIP[1]) ** 2) / (2 * 0.13 * 0.13)); },
    start: [-1.45 * CT + 0.15 * ST, -1.45 * ST - 0.15 * CT], guess: [0, 0], trapGuess: DIP, trapTol: 0.15, tol: 0.1, max: AUTO_SHOTS, pmax: 0.3,
    view: {x0: -1.6, x1: 1.6, y0: -1, y1: 1},
    goal: 'Write one rule. Autopilot plays 50 shots. End in the hole.', sub: 'Set power and keep rolling, then run. No touching once it starts.',
    card: ['You stopped hitting by hand and wrote a rule: one power, one keep-rolling, fifty shots.',
           'Training a model works this way. The valley is its error, the ball’s place is its settings, and a program takes millions of these steps.',
           'You have now felt the <b>learning rate</b>, <b>divergence</b>, <b>momentum</b> and the <b>local minimum</b>.'] },
];
for (const L of LEVELS){
  L.target = settle(L, L.guess, L.dim === 1 ? 0.01 : 0.005, 20000);
  if (L.trapGuess !== undefined) L.trap = settle(L, L.trapGuess, 0.005, 20000);
}

if (typeof module !== 'undefined') module.exports = {LEVELS, grad, step, judge, autopilot, outOfBounds, dist, heightAt, powerFromSlider, sliderFromPower, PMIN, PMAX, AUTO_SHOTS};

// ---------- the page ----------
if (typeof document !== 'undefined') (function(){
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const fogCv = document.createElement('canvas'), fctx = fogCv.getContext('2d');
let mapCv = null;          // top-view height map, rebuilt on resize or level change
let W = 0, Hh = 0, dpr = 1;
let C = {};                // colours read from CSS tokens

const STORE = 'fogGolf.cleared';
let cleared = new Set();
try { const s = JSON.parse(localStorage.getItem(STORE) || '[]'); if (Array.isArray(s)) cleared = new Set(s); } catch (e) {}
function saveCleared(){ try { localStorage.setItem(STORE, JSON.stringify([...cleared])); } catch (e) {} }

let li = 0;                // current level index
let power = 0.05, beta = 0;
let S = null;              // play state
let anim = null;           // current flight
let parts = [];            // particles
let shake = 0;
let fogA = 1;              // fog opacity, 1 = full
let fogTarget = 1;
let sinkT = -1;            // time since sink began (s), -1 when not sinking
let toastTimer = 0, cardTimer = 0;
let soundOn = false, actx = null;

function readColours(){
  const cs = getComputedStyle(document.documentElement);
  for (const k of ['paper','ink','panel','panel-2','line','muted','accent','t1','t2','t3','t4','t5','you','ucb','ts','fog','sky','ground','ground-2','cup'])
    C[k] = cs.getPropertyValue('--' + k).trim();
}
function hexRgb(h){ h = h.replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

// ---------- sound (off by default) ----------
function tone(freq, dur, type, vol, slide){
  if (!soundOn || !actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  hit(){ tone(520, 0.08, 'triangle', 0.18, 260); },
  land(){ tone(140, 0.09, 'sine', 0.12, 90); },
  sink(){ [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.13), i * 90)); },
  lost(){ tone(700, 0.6, 'sine', 0.1, 120); },
  bad(){ tone(180, 0.25, 'square', 0.05, 120); },
};

// ---------- geometry ----------
function L(){ return LEVELS[li]; }
function toScreen(p){
  const V = L().view;
  if (L().dim === 1){
    const y = L().f(p);
    return [(p - V.x0) / (V.x1 - V.x0) * W, Hh - (y - V.y0) / (V.y1 - V.y0) * Hh];
  }
  return [(p[0] - V.x0) / (V.x1 - V.x0) * W, Hh - (p[1] - V.y0) / (V.y1 - V.y0) * Hh];
}
function clampScreen(s){
  const m = Math.max(W, Hh) * 1.5;
  return [Math.max(-m, Math.min(W + m, Number.isFinite(s[0]) ? s[0] : -m)), Math.max(-m, Math.min(Hh + m, Number.isFinite(s[1]) ? s[1] : -m))];
}

function resize(){
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); Hh = Math.max(1, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
  fogCv.width = cv.width; fogCv.height = cv.height;
  buildMap();
}

// Top view: shade by height with contour bands.
function buildMap(){
  mapCv = null;
  if (!L() || L().dim !== 2 || W < 2) return;
  const V = L().view, step = 3;
  const nx = Math.ceil(W / step), ny = Math.ceil(Hh / step);
  const vals = new Float64Array(nx * ny);
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++){
    const x = V.x0 + (i + 0.5) / nx * (V.x1 - V.x0), y = V.y1 - (j + 0.5) / ny * (V.y1 - V.y0);
    vals[j * nx + i] = L().f(x, y);
  }
  const sorted = Array.from(vals).sort((a, b) => a - b);
  const lo = sorted[0], hi = sorted[Math.floor(sorted.length * 0.97)];
  const c0 = hexRgb(C.accent), c1 = hexRgb(C['panel-2']), cl = hexRgb(C.ink);
  mapCv = document.createElement('canvas'); mapCv.width = nx; mapCv.height = ny;
  const m = mapCv.getContext('2d'), img = m.createImageData(nx, ny);
  for (let k = 0; k < vals.length; k++){
    const t = Math.min(1, Math.sqrt(Math.max(0, (vals[k] - lo) / (hi - lo))));
    const band = t * 14, fr = band - Math.floor(band);
    const edge = fr < 0.09 ? 0.22 : 0;
    for (let c = 0; c < 3; c++){
      let v = c0[c] + (c1[c] - c0[c]) * t;
      v = v + (cl[c] - v) * edge;
      img.data[k * 4 + c] = v;
    }
    img.data[k * 4 + 3] = 255;
  }
  m.putImageData(img, 0, 0);
}

// ---------- state ----------
function newState(){
  const lv = L();
  S = { pos: lv.start, vel: lv.dim === 1 ? 0 : [0, 0], shots: 0, trail: [lv.start], status: 'play', moved: null, autoRun: null };
  clearTimeout(cardTimer);
  anim = null; parts = []; fogA = 1; fogTarget = 1; sinkT = -1; shake = 0;
  hideToast(); $('retry').classList.remove('pulse');
  updateHud(); updateButtons();
}
function setLevel(i){
  li = i;
  try { localStorage.setItem('fogGolf.level', String(i)); } catch (e) {}
  const lv = L();
  $('goal').innerHTML = lv.goal + '<small>' + lv.sub + '</small>';
  $('momrow').hidden = !lv.momentum;
  $('power').max = sliderFromPower(lv.pmax || PMAX);
  setPower(power);
  if (!lv.momentum) setBeta(0);
  $('hit').textContent = lv.auto ? 'Run 50' : 'Hit';
  renderLevels(); buildMap(); newState();
}
function unlocked(i){ return i === 0 || cleared.has(i - 1) || cleared.has(i); }
function renderLevels(){
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'lv' + (cleared.has(i) ? ' done' : '');
    b.textContent = i + 1; b.title = lv.name;
    b.setAttribute('aria-label', 'Level ' + (i + 1) + ': ' + lv.name + (cleared.has(i) ? ', cleared' : ''));
    if (i === li) b.setAttribute('aria-current', 'true');
    b.disabled = !unlocked(i);
    b.onclick = () => setLevel(i);
    box.appendChild(b);
  });
  const sp = document.createElement('span'); sp.className = 'spacer'; box.appendChild(sp);
  const s = document.createElement('button'); s.className = 'sound'; s.id = 'sound';
  s.setAttribute('aria-pressed', soundOn ? 'true' : 'false'); s.textContent = soundOn ? 'Sound on' : 'Sound off';
  s.onclick = () => {
    soundOn = !soundOn;
    if (soundOn && !actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
    if (actx && actx.state === 'suspended') actx.resume();
    renderLevels();
  };
  box.appendChild(s);
}
function fmt(v){
  const a = Math.abs(v);
  if (a === 0) return '0';
  if (a >= 10) return v.toFixed(1);
  if (a >= 1) return v.toFixed(2);
  if (a >= 0.01) return v.toFixed(3);
  return v.toPrecision(2);
}
function slopeMag(){ const g = grad(L(), S.pos); return L().dim === 1 ? Math.abs(g) : Math.hypot(g[0], g[1]); }
function updateHud(){
  const lv = L();
  const h = heightAt(lv, S.pos);
  const okPos = finitePos(lv, S.pos) && !outOfBounds(lv, S.pos);
  const parts = [
    lv.auto ? `<span class="chip">shots <b>${S.shots}</b> / ${lv.max}</span>` : `<span class="chip">shot <b>${S.shots}</b> / ${lv.max}</span>`,
    `<span class="chip">slope <b>${okPos ? fmt(slopeMag()) : '—'}</b></span>`,
    `<span class="chip">height <b>${okPos ? fmt(h) : '—'}</b></span>`,
  ];
  if (S.moved !== null) parts.push(`<span class="chip">last move <b>${Number.isFinite(S.moved) ? fmt(S.moved) : '∞'}</b></span>`);
  $('hud').innerHTML = parts.join('');
}
function updateButtons(){
  const busy = !!anim || !!S.autoRun || sinkT >= 0;
  const over = S.status === 'won' || S.status === 'lost' || S.status === 'out' || (L().auto && S.shots > 0);
  $('hit').disabled = busy || over;
}
function setPower(p){
  power = Math.max(PMIN, Math.min(L().pmax || PMAX, p));
  $('power').value = sliderFromPower(power);
  $('powerv').textContent = fmt(power);
  savePower();
}
// Power carries between holes (level 2's lesson needs it), so it survives a reload too.
function savePower(){ try { localStorage.setItem('fogGolf.power', String(power)); } catch (e) {} }
function setBeta(b){
  beta = Math.max(0, Math.min(0.95, Math.round(b * 20) / 20));
  $('mom').value = Math.round(beta * 100);
  $('momv').textContent = beta.toFixed(2);
}
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast(){ $('toast').classList.remove('on'); }

// ---------- shots ----------
function hit(){
  if ($('hit').disabled) return;
  const lv = L();
  if (lv.auto){ runAuto(); return; }
  const s = step(lv, S.pos, S.vel, power, beta);
  S.shots++;
  launch(S.pos, s.pos, () => {
    S.moved = dist(lv, S.pos, s.pos);
    S.pos = s.pos; S.vel = s.vel; S.trail.push(s.pos);
    afterShot(judge(lv, S.pos, S.shots));
  });
  sfx.hit();
}
function afterShot(st){
  const lv = L();
  S.status = st;
  if (st === 'lost'){ sfx.lost(); shake = 10; toast('Flew off into the fog. Press Retry.'); $('retry').classList.add('pulse'); }
  else if (st === 'won'){ startSink(); }
  else if (st === 'out'){ sfx.bad(); toast('Out of shots. Press Retry.'); $('retry').classList.add('pulse'); }
  else if (st === 'stuck'){ sfx.land(); dust();
    toast(`A shallow hole: height ${fmt(heightAt(lv, S.pos))}. Flat ground all round.`); }
  else { sfx.land(); dust();
    if (S.moved !== null && S.moved < 0.01) toast('It barely moved.', 1600); }
  updateHud(); updateButtons();
}
function launch(a, b, done, dur){
  const sa = toScreen(a), sb = clampScreen(toScreen(b));
  const d = Math.hypot(sb[0] - sa[0], sb[1] - sa[1]);
  anim = { sa, sb, t: 0, dur: dur || Math.min(0.9, 0.22 + d / 900), arc: Math.min(140, 6 + d * 0.35), done };
  updateButtons();
}
function runAuto(){
  const lv = L();
  const r = autopilot(lv, power, beta);
  S.autoRun = { path: r.path, i: 0, result: r.result, end: r.end };
  S.shots = 0;
  nextAuto();
}
function nextAuto(){
  const R = S.autoRun, lv = L();
  if (R.i >= R.path.length - 1){
    S.autoRun = null;
    S.status = R.result === 'won' ? 'won' : 'out';
    if (R.result === 'won'){ startSink(); }
    else {
      if (R.result === 'lost'){ sfx.lost(); shake = 10; toast('Autopilot flew off into the fog. Change the rule and retry.'); S.status = 'lost'; }
      else if (R.result === 'stuck'){ sfx.bad(); toast('Stopped in a small dip short of the hole. Change the rule and retry.'); }
      else { sfx.bad(); toast(`Ended ${fmt(dist(lv, R.end, lv.target))} from the hole. Change the rule and retry.`); }
      $('retry').classList.add('pulse');
    }
    updateHud(); updateButtons(); return;
  }
  const a = R.path[R.i], b = R.path[R.i + 1];
  launch(a, b, () => {
    R.i++; S.shots = R.i; S.moved = dist(lv, a, b); S.pos = b; S.trail.push(b);
    if (R.i % 3 === 0) sfx.land();
    updateHud(); nextAuto();
  }, 0.11);
}
function startSink(){
  sinkT = 0; fogTarget = 0; sfx.sink();
  const [x, y] = toScreen(L().target);
  const cols = [C.t1, C.t2, C.t3, C.t4, C.t5, C.ucb];
  for (let i = 0; i < 40; i++){
    const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 220;
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 160, life: 1.2 + Math.random() * 0.6, max: 1.8, c: cols[i % cols.length], r: 2 + Math.random() * 2.5, g: 380 });
  }
  if (!cleared.has(li)){ cleared.add(li); saveCleared(); }
  updateButtons();
  cardTimer = setTimeout(showCard, 1500);
}
function dust(){
  const [x, y] = toScreen(S.pos);
  for (let i = 0; i < 8; i++){
    const a = -Math.PI * Math.random();
    parts.push({ x, y, vx: Math.cos(a) * 60, vy: Math.sin(a) * 40, life: 0.45, max: 0.45, c: C.muted, r: 1.6, g: 120 });
  }
}
function showCard(){
  const lv = L();
  $('cardtag').textContent = lv.auto ? `Sunk by autopilot in ${AUTO_SHOTS} shots` : `Sunk in ${S.shots} shot${S.shots === 1 ? '' : 's'} · ${lv.name}`;
  $('cardbody').innerHTML = lv.card.map(t => '<p>' + t + '</p>').join('');
  $('next').hidden = li >= LEVELS.length - 1;
  $('veil').classList.add('on');
  renderLevels();
  (li >= LEVELS.length - 1 ? $('again') : $('next')).focus();
}
function closeCard(){ $('veil').classList.remove('on'); }

// ---------- drawing ----------
function drawSide(){
  const lv = L(), V = lv.view;
  const g = ctx.createLinearGradient(0, 0, 0, Hh);
  g.addColorStop(0, C.sky); g.addColorStop(1, C.panel);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);
  // terrain
  ctx.beginPath(); ctx.moveTo(0, Hh + 2);
  for (let px = 0; px <= W; px += 2){
    const x = V.x0 + px / W * (V.x1 - V.x0);
    ctx.lineTo(px, Hh - (lv.f(x) - V.y0) / (V.y1 - V.y0) * Hh);
  }
  ctx.lineTo(W, Hh + 2); ctx.closePath();
  const gg = ctx.createLinearGradient(0, 0, 0, Hh);
  gg.addColorStop(0, C.ground); gg.addColorStop(1, C['ground-2']);
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = C['ground-2']; ctx.lineWidth = 2; ctx.stroke();
  drawCup(lv.target, true);
  if (lv.trap !== undefined) drawCup(lv.trap, false);
}
function drawCup(p, flag){
  const [x, y] = toScreen(p);
  ctx.fillStyle = C.cup;
  ctx.beginPath(); ctx.ellipse(x, y + 1, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  if (!flag) return;
  const rise = sinkT >= 0 ? Math.min(1, sinkT / 0.5) : 1;
  const top = y - 34 * rise;
  ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, top); ctx.stroke();
  const wave = Math.sin(performance.now() / 260) * 2;
  ctx.fillStyle = C.you;
  ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + 16, top + 5 + wave * 0.5); ctx.lineTo(x, top + 10); ctx.closePath(); ctx.fill();
}
function drawTop(){
  const lv = L();
  if (mapCv){ ctx.imageSmoothingEnabled = true; ctx.drawImage(mapCv, 0, 0, W, Hh); }
  else { ctx.fillStyle = C['panel-2']; ctx.fillRect(0, 0, W, Hh); }
  const [x, y] = toScreen(lv.target);
  ctx.fillStyle = C.cup; ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = C.panel; ctx.lineWidth = 1.5; ctx.stroke();
  const rise = sinkT >= 0 ? Math.min(1, sinkT / 0.5) : 1;
  ctx.strokeStyle = C.ink; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 2, y - 26 * rise); ctx.stroke();
  ctx.fillStyle = C.you; ctx.beginPath(); ctx.moveTo(x + 2, y - 26 * rise); ctx.lineTo(x + 16, y - 22 * rise); ctx.lineTo(x + 2, y - 17 * rise); ctx.fill();
  if (lv.trap){ const [tx, ty] = toScreen(lv.trap); ctx.fillStyle = C.cup; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
}
function ballScreen(){
  if (anim){
    const t = Math.min(1, anim.t / anim.dur), e = t;
    const x = anim.sa[0] + (anim.sb[0] - anim.sa[0]) * e;
    const yl = anim.sa[1] + (anim.sb[1] - anim.sa[1]) * e;
    return { x, y: yl - anim.arc * 4 * t * (1 - t), ground: yl, air: 4 * t * (1 - t) };
  }
  const [x, y] = clampScreen(toScreen(S.pos));
  return { x, y, ground: y, air: 0 };
}
function drawFog(b){
  if (fogA <= 0.001) return;
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.globalCompositeOperation = 'source-over';
  fctx.clearRect(0, 0, W, Hh);
  fctx.globalAlpha = fogA; fctx.fillStyle = C.fog; fctx.fillRect(0, 0, W, Hh);
  // drifting wisps
  const t = performance.now() / 1000;
  fctx.globalAlpha = fogA * 0.35; fctx.fillStyle = C.panel;
  for (let i = 0; i < 6; i++){
    const wx = ((i * 0.23 + t * 0.012 * (1 + i % 3)) % 1.3 - 0.15) * W, wy = (0.15 + 0.14 * i) * Hh, rr = Hh * (0.18 + 0.05 * (i % 3));
    const gr = fctx.createRadialGradient(wx, wy, 0, wx, wy, rr);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(wx, wy, rr, 0, Math.PI * 2); fctx.fill();
  }
  fctx.globalAlpha = 1;
  fctx.globalCompositeOperation = 'destination-out';
  const R = L().dim === 1 ? 46 : 40;
  const gr = fctx.createRadialGradient(b.x, b.ground, R * 0.35, b.x, b.ground, R);
  gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(b.x, b.ground, R, 0, Math.PI * 2); fctx.fill();
  fctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogCv, 0, 0, W, Hh);
}
function drawTrail(){
  const tr = S.trail, n = tr.length;
  if (n < 2) return;
  const revealed = 1 - fogA;
  if (revealed > 0.02){   // full path once the fog lifts
    ctx.globalAlpha = revealed * 0.8; ctx.strokeStyle = C.you; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
    ctx.beginPath(); tr.forEach((p, i) => { const s = clampScreen(toScreen(p)); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }
  for (let i = 0; i < n - 1; i++){
    const s = clampScreen(toScreen(tr[i]));
    ctx.globalAlpha = 0.15 + 0.45 * (i + 1) / n;
    ctx.fillStyle = C.you; ctx.beginPath(); ctx.arc(s[0], s[1], 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawArrow(b){
  if (anim || S.status === 'lost' || sinkT >= 0) return;
  const lv = L();
  if (!finitePos(lv, S.pos) || outOfBounds(lv, S.pos)) return;
  const g = grad(lv, S.pos);
  let dx, dy, mag;
  if (lv.dim === 1){
    mag = Math.abs(g);
    const V = lv.view, sx = W / (V.x1 - V.x0), sy = Hh / (V.y1 - V.y0);
    const dir = -Math.sign(g) || 1;
    // downhill tangent in screen px: a step dir in x drops height by |g|, which is +y on screen
    dx = dir * sx; dy = -dir * g * sy;
    const n = Math.hypot(dx, dy); dx /= n; dy /= n;
  } else {
    mag = Math.hypot(g[0], g[1]);
    if (mag < 1e-9) return;
    dx = -g[0] / mag; dy = g[1] / mag;
  }
  const len = 10 + 46 * Math.tanh(mag / 1.5);
  const x0 = b.x + dx * 10, y0 = b.y + dy * 10 - (lv.dim === 1 ? 4 : 0);
  const x1 = x0 + dx * len, y1 = y0 + dy * len;
  ctx.strokeStyle = C.you; ctx.fillStyle = C.you; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
  const a = Math.atan2(dy, dx);
  ctx.beginPath(); ctx.moveTo(x1 + Math.cos(a) * 6, y1 + Math.sin(a) * 6);
  ctx.lineTo(x1 + Math.cos(a + 2.5) * 8, y1 + Math.sin(a + 2.5) * 8);
  ctx.lineTo(x1 + Math.cos(a - 2.5) * 8, y1 + Math.sin(a - 2.5) * 8); ctx.closePath(); ctx.fill();
}
function drawBall(b){
  let r = 7, alpha = 1;
  let x = b.x, y = b.y;
  if (sinkT >= 0){
    const [hx, hy] = toScreen(L().target);
    const t = Math.min(1, sinkT / 0.45);
    x = x + (hx - x) * t; y = y + (hy - y) * t;
    r = 7 * (1 - 0.75 * t); alpha = 1 - 0.8 * t;
    // ripples
    for (let k = 0; k < 3; k++){
      const rt = sinkT - k * 0.18;
      if (rt > 0 && rt < 1){ ctx.globalAlpha = 1 - rt; ctx.strokeStyle = C.ts; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(hx, hy, 8 + rt * 60, (8 + rt * 60) * (L().dim === 1 ? 0.35 : 1), 0, 0, Math.PI * 2); ctx.stroke(); }
    }
    ctx.globalAlpha = 1;
  }
  if (L().dim === 1) y -= r;
  if (b.air > 0){   // shadow on the ground
    ctx.globalAlpha = 0.25 * (1 - b.air * 0.6); ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, b.ground, r * (1 - b.air * 0.4), r * 0.35, 0, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
  }
  if (L().dim === 2) r *= 1 + 0.5 * b.air;
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff'; ctx.strokeStyle = C.ink; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.arc(x + r * 0.25, y + r * 0.25, r * 0.55, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}
function drawParts(dt){
  parts = parts.filter(p => (p.life -= dt) > 0);
  for (const p of parts){
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

let last = 0, raf = 0;
function frame(now){
  raf = requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
  if (anim){
    anim.t += dt;
    if (anim.t >= anim.dur){ const d = anim.done; anim = null; d(); }
  }
  if (sinkT >= 0) sinkT += dt;
  fogA += (fogTarget - fogA) * Math.min(1, dt * 2.2);
  if (shake > 0) shake = Math.max(0, shake - dt * 30);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.clearRect(-20, -20, W + 40, Hh + 40);
  if (L().dim === 1) drawSide(); else drawTop();
  const b = ballScreen();
  drawFog(b);
  drawTrail();
  drawArrow(b);
  if (S.status !== 'lost' || anim) drawBall(b);
  drawParts(dt);
}
function start(){ if (!raf){ last = performance.now(); raf = requestAnimationFrame(frame); } }
function stop(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }
document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());

// ---------- wiring ----------
$('power').addEventListener('input', e => { power = powerFromSlider(+e.target.value); $('powerv').textContent = fmt(power); savePower(); });
$('pdown').onclick = () => setPower(power / 1.15);
$('pup').onclick = () => setPower(power * 1.15);
$('mom').addEventListener('input', e => setBeta(+e.target.value / 100));
$('mdown').onclick = () => setBeta(beta - 0.05);
$('mup').onclick = () => setBeta(beta + 0.05);
$('hit').onclick = hit;
$('retry').onclick = () => { closeCard(); newState(); };
$('again').onclick = () => { closeCard(); newState(); };
$('next').onclick = () => { closeCard(); if (li < LEVELS.length - 1) setLevel(li + 1); };
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if ($('veil').classList.contains('on')){
    if (e.key === 'Escape'){ closeCard(); }
    return;
  }
  if (e.key === 'r' || e.key === 'R'){ newState(); e.preventDefault(); return; }
  if (tag === 'input' || tag === 'button') return;
  if (e.key === ' ' || e.key === 'Enter'){ hit(); e.preventDefault(); }
  else if (e.key === 'ArrowUp'){ setPower(power * 1.1); e.preventDefault(); }
  else if (e.key === 'ArrowDown'){ setPower(power / 1.1); e.preventDefault(); }
});
const mq = window.matchMedia('(prefers-color-scheme: dark)');
const onScheme = () => { readColours(); buildMap(); };
if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
