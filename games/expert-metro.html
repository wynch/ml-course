<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expert Metro — ml-course game</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root{
    --paper:#f6f8f7; --ink:#1c2422; --panel:#ffffff; --panel-2:#eef2f0;
    --line:#d5ddda; --muted:#5d6b67; --accent:#1f918d;
    --t1:#453781; --t2:#1f918d; --t3:#3fa34d; --t4:#b8336a; --t5:#1d6fb8; --t9:#4f6272;
    --ucb:#eb6834; --warn:#c8402f;
    --c0:#eb6834; --c1:#1d6fb8; --c2:#3fa34d; --c3:#b8336a;
    --shadow:0 1px 2px rgba(20,40,35,.06), 0 6px 18px rgba(20,40,35,.05);
    --mono:"SF Mono", ui-monospace, Menlo, Consolas, monospace;
    --display:"Avenir Next","Helvetica Neue",sans-serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#121816; --ink:#e8eeec; --panel:#1a2320; --panel-2:#222d29;
      --line:#31403b; --muted:#9dada8; --accent:#37b3ae; --t4:#e0679a; --t5:#5aa1e6; --t9:#93a8b8;
      --ucb:#d95926; --warn:#ec6a58;
      --c0:#e8743d; --c1:#5aa1e6; --c2:#52b860; --c3:#e0679a;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
  body{font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 64px}

  header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:16px 0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
  header.top h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em}
  .pill{font-family:var(--display);font-size:11.5px;font-weight:600;letter-spacing:.02em;
    padding:3px 10px;border-radius:999px;color:#fff;background:var(--t9);white-space:nowrap}
  @media (prefers-color-scheme: dark){ .pill{color:#121816} }
  .top .spacer{flex:1}
  .backlink{font-size:13px;color:var(--muted);text-decoration:none;border-bottom:1px solid transparent;
    min-height:44px;display:inline-flex;align-items:center}
  .backlink:hover{color:var(--accent)}

  .intro{max-width:70ch;font-size:15px;margin:0 0 16px}
  h2{font-family:var(--display);font-size:15px;font-weight:600;margin:0 0 4px;letter-spacing:.01em}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:14px}

  .btn{font-family:var(--display);font-size:13px;font-weight:600;border:1.5px solid var(--line);
    background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;cursor:pointer;
    min-height:44px;min-width:44px}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .btn.primary{color:#121816} }
  .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  @media (prefers-color-scheme: dark){ .btn[aria-pressed="true"]{color:#121816} }
  .btn:focus-visible,.lvl:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn:disabled{opacity:.45;cursor:default}

  .levels{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .lvl{font-family:var(--display);font-size:13px;font-weight:600;min-height:44px;min-width:44px;
    padding:6px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
  .lvl[aria-current="true"]{border-color:var(--accent);color:var(--accent)}
  .lvl:disabled{opacity:.4;cursor:default}
  .lvl .done{color:var(--accent);margin-left:4px}

  .hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .hud h2{margin:0 8px 0 0}
  .chip{font-family:var(--mono);font-size:12px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:999px;padding:4px 10px;color:var(--muted);white-space:nowrap}
  .chip b{color:var(--ink)}
  .chip.bad b{color:var(--warn)}
  .bar{height:4px;border-radius:2px;background:var(--panel-2);overflow:hidden;margin:0 0 10px}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

  .stage{position:relative;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--panel-2)}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:14px;
    background:rgba(128,140,136,.28);background:color-mix(in srgb, var(--panel-2) 72%, transparent)}
  .ov[hidden]{display:none}
  .ovcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
    padding:16px 18px;max-width:460px;width:100%;max-height:100%;overflow:auto}
  .ovcard h2{font-size:16px;margin:0 0 6px}
  .ovcard p{margin:0 0 10px;font-size:14px}
  .ovcard .kicker{font-family:var(--display);font-size:11.5px;font-weight:600;color:var(--accent);
    letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px}
  .ovcard .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 0}
  .controls .hint{font-size:12.5px;color:var(--muted)}
  .knob{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .knob input{width:180px;max-width:60vw;accent-color:var(--accent);min-height:44px}
  .knob output{font-family:var(--mono);font-size:12.5px;min-width:9ch}

  .board{margin:12px 0 0;border-collapse:collapse}
  .board th{font-family:var(--display);font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:2px 6px 4px 0}
  .board td{padding:3px 6px 3px 0}
  .board th svg{display:block;margin:0 auto}
  .board .name{font-family:var(--display);font-size:13px;font-weight:600;white-space:nowrap;padding-right:10px}
  .board .name i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
  .cell{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);cursor:pointer;
    padding:0;display:flex;align-items:center;justify-content:center}
  .cell span{display:block;width:22px;height:6px;border-radius:3px;background:transparent}
  .cell[aria-pressed="true"]{border-color:var(--ink)}
  .toast{font-size:12.5px;color:var(--warn);min-height:20px;margin:6px 0 0}
  .tip{font-size:12.5px;color:var(--muted);margin:8px 0 0;max-width:80ch}

  footer.bot{border-top:1px solid var(--line);padding-top:14px;margin-top:26px;font-size:12.5px;color:var(--muted)}
  footer.bot a{color:var(--accent)}
  footer.bot p{margin:4px 0;max-width:80ch}
  a.backlink{display:inline-flex;align-items:center;min-height:44px}
</style>
<body>
<div class="wrap">
<header class="top">
  <h1>Expert Metro</h1>
  <span class="pill">Game 7</span>
  <span class="spacer"></span>
  <button class="btn" id="sound" aria-pressed="false">sound off</button>
  <a class="backlink" href="index.html">← All games</a>
</header>

<p class="intro">Words ride in as coloured dots. Lay lines from each gate to a station that serves its colour.
  A station handles one rider at a time; when its platform fills, new riders are lost.</p>

<nav class="levels" id="levels" aria-label="Levels"></nav>

<section class="card">
  <div class="hud" id="hud"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Metro map"></canvas>
    <div class="ov" id="ov"><div class="ovcard" id="ovcard"></div></div>
  </div>
  <div class="controls" id="controls"></div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div id="boardwrap"></div>
  <p class="tip" id="tip"></p>
</section>

<footer class="bot">
  <p><a href="index.html">← All games</a></p>
  <p id="how" hidden></p>
</footer>
</div>

<script>
/* CORE START: the game's model and simulation; no DOM here, so the tests can run it */
var CORE = (function(){
  "use strict";
  function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function gauss(r){ var u=r()||1e-9, v=r(); return Math.sqrt(-2*Math.log(u))*Math.cos(6.283185307*v); }

  var E=4, D=3, CFG={sig:0.2, wrong:0.6, off:0.5, initU:0.1, initW:0.01};
  // each topic sits at its own corner of a plane; the answer the model must give is +1 or -1
  var CX=[1,0,-1,0], CY=[0,1,0,-1], TARGET=[1,-1,1,-1];
  var BALANCE=[0,0.03,0.1,0.3,1,3,10];

  function pickColour(r,mix){ var u=r(), a=0; for(var c=0;c<mix.length-1;c++){ a+=mix[c]; if(u<a) return c; } return mix.length-1; }
  function features(r,c){ return [CX[c]+CFG.sig*gauss(r), CY[c]+CFG.sig*gauss(r), 1]; }

  // Router: a softmax gate over E experts. Experts: one linear map each. Top-1 routing.
  function makeModel(seed){
    var r=mulberry(seed*7919+13), W=[], U=[];
    for(var e=0;e<E;e++){ W.push([0,0,0].map(function(){return CFG.initW*gauss(r);}));
                          U.push([0,0,0].map(function(){return CFG.initU*gauss(r);})); }
    return {r:r, W:W, U:U, lrW:0.15, lrU:0.6, batch:16, steps:0, lastLoss:0.5};
  }
  function gate(m,x){
    var z=[], mx=-1e9, s=0, p=[], e, best=0;
    for(e=0;e<E;e++){ z[e]=m.W[e][0]*x[0]+m.W[e][1]*x[1]+m.W[e][2]*x[2]; if(z[e]>mx) mx=z[e]; }
    for(e=0;e<E;e++){ p[e]=Math.exp(z[e]-mx); s+=p[e]; }
    for(e=0;e<E;e++){ p[e]/=s; if(p[e]>p[best]) best=e; }
    return {p:p, e:best};
  }
  function expertOut(m,e,x){ var U=m.U[e]; return U[0]*x[0]+U[1]*x[1]+U[2]*x[2]; }
  // how wrong the routed answer is for this word: 0 is perfect
  function answerError(m,x,c){ var g=gate(m,x); return Math.abs(g.p[g.e]*expertOut(m,g.e,x)-TARGET[c]-CFG.off); }

  function routedError(m,x,c,e){ var g=gate(m,x); return Math.min(1.5,Math.abs(g.p[e]*expertOut(m,e,x)-TARGET[c]-CFG.off)); }
  // one gradient step on a batch: task loss 0.5*(p_e*o_e - y)^2, plus alpha * E * sum_i f_i * P_i
  function trainStep(m,mix,alpha){
    var B=m.batch, toks=[], gs=[], f=[0,0,0,0], gW=[], gU=[], L=0, i, j, k;
    for(i=0;i<E;i++){ gW.push([0,0,0]); gU.push([0,0,0]); }
    for(k=0;k<B;k++){ var c=pickColour(m.r,mix); var x=features(m.r,c); toks.push({x:x,y:TARGET[c]+CFG.off}); var g=gate(m,x); gs.push(g); f[g.e]+=1/B; }
    for(k=0;k<B;k++){
      var t=toks[k], p=gs[k].p, e=gs[k].e, o=expertOut(m,e,t.x), d=p[e]*o-t.y;
      L+=0.5*d*d/B;
      for(j=0;j<D;j++) gU[e][j]+=d*p[e]*t.x[j]/B;
      var fp=0; for(i=0;i<E;i++) fp+=f[i]*p[i];
      for(i=0;i<E;i++){
        var dz=d*o*p[e]*((i===e?1:0)-p[i])/B + alpha*E/B*p[i]*(f[i]-fp);
        for(j=0;j<D;j++) gW[i][j]+=dz*t.x[j];
      }
    }
    for(i=0;i<E;i++) for(j=0;j<D;j++){ m.W[i][j]-=m.lrW*gW[i][j]; m.U[i][j]-=m.lrU*gU[i][j]; }
    m.steps++; m.lastLoss=L;
    return {f:f, loss:L};
  }

  // ---- metro simulation ----
  function newSim(L,seed){
    var S={L:L, t:0, r:mulberry(seed||1), next:0, delivered:0, dropped:0, wrong:0, status:'play', id:0,
      gates:L.mix.map(function(){return {wait:[]};}),
      stations:L.stations.map(function(){return {q:[], job:null, load:[0,0,0,0], seen:0};}),
      riders:[], events:[], routes:L.mix.map(function(){return [];}), turn:L.mix.map(function(){return 0;}), alpha:0, trainAcc:0, release:0};
    if(L.learn){ S.model=makeModel(seed||1); S.alpha=L.alpha0||0; }
    S.next=expo(S);
    return S;
  }
  function rateAt(S){ var L=S.L; return L.rate*Math.min(1, 0.35+0.65*S.t/L.ramp); }
  function expo(S){ return -Math.log(1-S.r()*0.999)/rateAt(S); }

  function sendRider(S,p,st,share,work){
    S.riders.push({id:p.id, c:p.c, word:p.word, x:p.x, st:st, share:share, work:work, u:0});
  }
  function dispatch(S,p){
    var L=S.L;
    if(L.learn){
      var e=gate(S.model,p.x).e;
      sendRider(S,p,e,1,L.base*(1+L.kappa*routedError(S.model,p.x,p.c,e)));
      return;
    }
    var rt=S.routes[p.c];
    if(!rt.length){
      var gq=S.gates[p.c].wait;
      if(gq.length>=L.gateCap){ S.dropped++; S.events.push({k:'drop',at:'gate',c:p.c}); }
      else gq.push(p);
      return;
    }
    // two lines: whole riders take them in turn, so each station gets half the riders
    var k=rt[(S.turn[p.c]++)%rt.length], good=L.stations[k].good.indexOf(p.c)>=0;
    sendRider(S,p,k,1,good?L.good:L.poor);
  }
  function spawn(S){
    var L=S.L, c=pickColour(S.r,L.mix), p={id:++S.id, c:c, word:Math.floor(S.r()*1000)};
    if(L.learn) p.x=features(S.r,c);
    S.events.push({k:'spawn',c:c,word:p.word});
    dispatch(S,p);
  }
  function setRoute(S,c,st){ // toggle; returns false if refused
    var rt=S.routes[c], i=rt.indexOf(st);
    if(i>=0){ rt.splice(i,1); return true; }
    if(rt.length>=2) return false;
    rt.push(st); return true;
  }
  function step(S,dt){
    if(S.status!=='play') return;
    var L=S.L, i;
    S.t+=dt;
    // arrivals
    S.next-=dt;
    while(S.next<=0){ spawn(S); S.next+=expo(S); }
    // riders waiting at a gate leave once their colour has a line
    S.release-=dt;
    if(S.release<=0){
      for(var c=0;c<S.gates.length;c++){
        if(S.routes[c].length && S.gates[c].wait.length){ dispatch(S,S.gates[c].wait.shift()); S.release=0.18; break; }
      }
    }
    // training
    if(L.learn){
      S.trainAcc+=dt*L.stepsPerSec;
      while(S.trainAcc>=1){ S.trainAcc-=1; trainStep(S.model,L.mix,S.alpha); }
    }
    // travel
    for(i=S.riders.length-1;i>=0;i--){
      var rd=S.riders[i]; rd.u+=dt/L.travel;
      if(rd.u>=1){
        S.riders.splice(i,1);
        var st=S.stations[rd.st];
        st.load[rd.c]+=rd.share; st.seen+=rd.share;
        if(st.q.length>=L.cap){ S.dropped+=rd.share; S.events.push({k:'drop',at:'station',st:rd.st,c:rd.c,share:rd.share}); }
        else st.q.push(rd);
      }
    }
    // service, and fading load memory
    var decay=Math.exp(-dt/5);
    for(i=0;i<S.stations.length;i++){
      var s=S.stations[i];
      for(var k=0;k<4;k++) s.load[k]*=decay;
      if(!s.job && s.q.length){ s.job=s.q.shift(); s.left=s.job.work; s.total=s.job.work; }
      if(s.job){ s.left-=dt; if(s.left<=0){
        var wrong=L.learn && routedError(S.model,s.job.x,s.job.c,i)>CFG.wrong;
        S.delivered+=s.job.share; if(wrong) S.wrong++;
        S.events.push({k:'done',st:i,c:s.job.c,wrong:wrong}); s.job=null; } }
    }
    if(S.dropped>L.maxDrop+1e-9){ S.status='lost'; S.why='drop'; }
    else if(L.maxWrong!=null && S.wrong>L.maxWrong){ S.status='lost'; S.why='wrong'; }
    else if(S.delivered>=L.goal-1e-9) S.status='won';
  }
  function shares(S){ // share of recent load per station
    var tot=0, out=S.stations.map(function(s){ var a=s.load.reduce(function(x,y){return x+y;},0); tot+=a; return a; });
    return out.map(function(a){ return tot>0?a/tot:0; });
  }

  var LEVELS=[
    {name:'First line', mix:[0.5,0.5], stations:[{good:[0]},{good:[1]}], rate:1.3, ramp:8,
     good:0.7, poor:3.5, cap:8, gateCap:6, travel:1.3, goal:30, maxDrop:4,
     solution:[[0],[1]]},
    {name:'Four lines', mix:[0.25,0.25,0.25,0.25], stations:[{good:[0]},{good:[1,2]},{good:[2]},{good:[3]}], rate:2.6, ramp:10,
     good:0.85, poor:2.6, cap:8, gateCap:6, travel:1.3, goal:70, maxDrop:5,
     solution:[[0],[1],[2],[3]]},
    {name:'Rush hour', mix:[0.6,0.14,0.13,0.13], stations:[{good:[0,1]},{good:[1,2]},{good:[2,3]},{good:[3,0]}], rate:3.0, ramp:12,
     good:0.9, poor:2.7, cap:8, gateCap:6, travel:1.3, goal:90, maxDrop:6,
     solution:[[0,3],[1],[1],[2]]},
    {name:'Autopilot', learn:true, mix:[0.25,0.25,0.25,0.25], stations:[{},{},{},{}], rate:3.0, ramp:14,
     base:0.95, kappa:0.3, stepsPerSec:10, cap:8, travel:1.3, goal:120, maxDrop:8, alpha0:0, balance:'toggle',
     solution:{alpha:0.3}},
    {name:'Night rush', learn:true, mix:[0.5,0.2,0.15,0.15], stations:[{},{},{},{}], rate:2.6, ramp:14,
     base:0.8, kappa:0.3, stepsPerSec:10, cap:8, travel:1.3, goal:140, maxDrop:8, maxWrong:26, alpha0:0, balance:'slider',
     solution:{alpha:0.3}}
  ];

  return {CFG:CFG, features:features, pickColour:pickColour, mulberry:mulberry, gauss:gauss, E:E, TARGET:TARGET, CX:CX, CY:CY, BALANCE:BALANCE,
    makeModel:makeModel, gate:gate, expertOut:expertOut, routedError:routedError, answerError:answerError, trainStep:trainStep,
    newSim:newSim, step:step, setRoute:setRoute, shares:shares, LEVELS:LEVELS};
})();
/* CORE END */

/* ---- the page: drawing, input, levels ---- */
(function(){
  "use strict";
  var LV = CORE.LEVELS;
  var STEP = 1/60;
  var TOPICS = [
    {name:'food',   words:['bread','plum','soup','rice','pear','cake','bean','fig','tea','corn','lime','stew']},
    {name:'sea',    words:['wave','reef','tide','gull','shell','boat','kelp','crab','foam','cove','surf','eel']},
    {name:'plants', words:['fern','oak','moss','seed','leaf','root','vine','pine','rose','reed','ivy','bud']},
    {name:'music',  words:['drum','song','harp','beat','tune','horn','bass','choir','flute','chord','hum','bell']}
  ];
  var GLYPH = ['●','■','▲','◆'];
  var SHAPE_NAME = ['circle','square','triangle','diamond'];

  var TEXT = [
    { intro:'Two kinds of word: food and sea. The pip inside a station shows the colour it serves fast. ' +
            'Drag from a gate to a station to lay a line, or tap the gate, then the station. Tap again to lift a line.',
      goal:'Carry 30 riders. Lose more than 4 and the line shuts.',
      lose:'Too many riders lost. Match each gate to the station whose pip has its colour.',
      win:['You sent each kind of word to the station that knows it. A part of a model that handles some inputs well is called an <b>expert</b>, and choosing the expert for each input is <b>routing</b>.'] },
    { intro:'Four kinds of word, four stations. A station serves the colours of its pips fast and the rest slowly.',
      goal:'Carry 70 riders. Lose at most 5.',
      lose:'A station filled up. Two busy colours on one station is one too many; look for another station with the same pip.',
      win:['Four experts, and each word used only one of them. The whole system is big, yet each word costs only one small part. That design is a <b>mixture of experts</b>.'] },
    { intro:'Rush hour: most riders are food words, more than one station can take. A colour may have two lines; its riders then take the two in turn.',
      goal:'Carry 90 riders. Lose at most 6.',
      lose:'The food station could not keep up. Give food a second line to the other station with an orange pip, and move other colours off it.',
      win:['One topic swamped its station, so you shared it between two. Keeping every expert’s queue short is <b>load balancing</b>.',

  // ---------- storage ----------

  // octilinear path from gate c to station s, shifted so each colour runs in its own lane
  function path(c, s){

    if(!portrait){

  function pointAt(pts, u){

  // ---------- drawing ----------
  function shapePath(k, x, y, r){
    ctx.beginPath();

    else if(k === 2){ ctx.moveTo(x, y-r*1.15); ctx.lineTo(x+r*1.1, y+r*0.8); ctx.lineTo(x-r*1.1, y+r*0.8); ctx.closePath(); }

  }
  function strokePath(pts){
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);

  function dot(x, y, r, c){ ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fillStyle = c; ctx.fill(); }

  function routeShares(){ // learned levels: share of each colour's recent riders per station

      var row = [], tot = 0;

      out.push(row.map(function(v){ return tot > 0 ? v/tot : 0; }));
    }
    return out;
  }

  function draw(time){
    var L = LV[cur], c, s, i;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = col.panel; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // lines
    if(L.learn){
      var sh = routeShares();

    }

      dot(g.x, g.y, R, col.topic[c]);

      ctx.fillStyle = col.muted; ctx.font = '600 11px ' + getFont();
      if(!portrait) ctx.fillText(TOPICS[c].name, g.x, g.y + R + 11);
      else ctx.fillText(TOPICS[c].name, g.x, g.y + R + 11);
      // riders waiting at the gate
      var wq = S.gates[c].wait;
      for(i=0;i<wq.length;i++){
        var wx, wy;
        if(!portrait){ wx = g.x - R - 10 - (i%3)*10; wy = g.y - 5 + Math.floor(i/3)*10; }
        else { wx = g.x - 10 + (i%3)*10; wy = g.y - R - 10 - Math.floor(i/3)*10; }

  var fontCache = null;

  // ---------- HUD ----------

  // ---------- switchboard (manual levels) ----------

  // ---------- controls ----------

      'A colour with two lines sends its riders down each in turn.',
      'The bars by each gate are the router’s shares for a typical word of that colour. Line width shows where words really went.',
      'Bars by each gate: the router’s shares. A cross by a station is a wrong answer.'
    ];
    $('tip').textContent = tips[cur];
  }
  function setPaused(p){
    paused = p;
    var b = $('pause'); if(b) b.textContent = paused ? 'resume' : 'pause';
  }

  // ---------- levels ----------
  function buildLevels(){
    var h = '';
    for(var i=0;i<LV.length;i++){
      h += '<button class="lvl" data-i="' + i + '"' + (unlocked(i) ? '' : ' disabled') + (i === cur ? ' aria-current="true"' : '') + '>' +
        (i+1) + ' · ' + LV[i].name + (cleared.indexOf(i) >= 0 ? '<span class="done" aria-label="cleared">✓</span>' : '') + '</button>';
    }
    $('levels').innerHTML = h;
    Array.prototype.forEach.call($('levels').querySelectorAll('.lvl'), function(b){
      b.addEventListener('click', function(){ keepRoutes = null; keepAlpha = null; load(+b.getAttribute('data-i')); });
    });
    var how = $('how');
    if(cleared.indexOf(3) >= 0){
      how.hidden = false;
      how.textContent = 'How levels 4 and 5 work: each word is a point with two numbers plus a constant. The router is a softmax gate, ' +
        'a 4 × 3 weight table, and each station is a linear expert with three weights. The page trains both by plain gradient descent, ' +
        'ten steps a second on batches of 16 words, on the error of the routed answer; the balance knob adds weight × 4 × the sum, over stations, ' +
        'of (share of words sent there) × (mean gate share there). Each word rides to the station with the top score.';
    } else how.hidden = true;
  }
  function newSim(){
    S = CORE.newSim(LV[cur], (Math.floor(Math.random()*1e9) + 1));
    if(keepRoutes && !LV[cur].learn) keepRoutes.forEach(function(rt, c){ rt.forEach(function(s){ CORE.setRoute(S, c, s); }); });
    if(keepAlpha != null && LV[cur].learn) S.alpha = keepAlpha;
    parts = []; labels = []; sel = -1; drag = null;
  }
  function load(i){
    cur = i; running = false; paused = false;
    // learned levels take no input on the map, so let a finger on it scroll the page
    cv.style.touchAction = LV[cur].learn ? 'pan-y' : 'none';
    layout(); newSim(); buildLevels(); buildControls(); buildBoard(); hud();
    showIntro();
  }
  function restart(){
    if(S && !LV[cur].learn) keepRoutes = S.routes.map(function(r){ return r.slice(); });
    newSim(); buildControls(); buildBoard(); hud();
    running = true; setPaused(false); ov.hidden = true;
  }
  function card(kicker, title, paras, buttons){
    var h = (kicker ? '<p class="kicker">' + kicker + '</p>' : '') + '<h2>' + title + '</h2>';
    paras.forEach(function(p){ h += '<p>' + p + '</p>'; });
    h += '<div class="row">';
    buttons.forEach(function(b, i){ h += '<button class="btn' + (i === 0 ? ' primary' : '') + '" data-b="' + i + '">' + b[0] + '</button>'; });
    ovcard.innerHTML = h + '</div>';
    Array.prototype.forEach.call(ovcard.querySelectorAll('button'), function(el){
      el.addEventListener('click', buttons[+el.getAttribute('data-b')][1]);
    });
    ov.hidden = false;
    var first = ovcard.querySelector('button'); if(first) try { first.focus({preventScroll:true}); } catch(e){}
  }
  function showIntro(){
    var T = TEXT[cur];
    card('Level ' + (cur+1), LV[cur].name, [T.intro, '<b>' + T.goal + '</b>'], [['Start', function(){ ov.hidden = true; running = true; setPaused(false); }]]);
  }
  function end(){
    running = false;
    var T = TEXT[cur], L = LV[cur];
    if(S.status === 'won'){
      saveCleared(cur); buildLevels();
      var btns = [];
      if(cur < LV.length-1) btns.push(['Next level', function(){ keepRoutes = null; keepAlpha = null; load(cur+1); }]);
      btns.push(['Play again', function(){ restart(); }]);
      card('What you just did', 'Level cleared', T.win, btns);
    } else {
      var msg;
      if(cur === 4) msg = S.why === 'wrong' ? T.loseWrong : T.loseDrop;
      else if(cur === 3) msg = S.alpha > 0 ? 'The stations still jammed. Try once more; the router starts from new random weights each time.' : T.lose;
      else msg = T.lose;
      card('Line shut', 'Not this time', [msg], [['Try again', function(){ restart(); }]]);
    }
  }

  // ---------- input ----------
  function pt(e){ var r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
  function hit(list, p, rad){
    var best = -1, bd = rad;
    for(var i=0;i<list.length;i++){ var d = Math.hypot(list[i].x - p.x, list[i].y - p.y); if(d < bd){ bd = d; best = i; } }
    return best;
  }
  cv.addEventListener('pointerdown', function(e){
    if(!S || LV[cur].learn || S.status !== 'play') return;
    var p = pt(e), g = hit(pos.gates, p, 28);
    if(g >= 0){
      drag = {c:g, x:p.x, y:p.y, x0:p.x, y0:p.y, moved:false};
      try { cv.setPointerCapture(e.pointerId); } catch(err){}
      e.preventDefault(); return;
    }
    var s = hit(pos.st, p, 30);
    if(s >= 0 && sel >= 0){ toggle(sel, s); e.preventDefault(); return; }
    sel = -1;
  });
  cv.addEventListener('pointermove', function(e){
    if(!drag) return;
    var p = pt(e); drag.x = p.x; drag.y = p.y;
    if(Math.hypot(p.x - drag.x0, p.y - drag.y0) > 10) drag.moved = true;
  });
  function up(e){
    if(!drag) return;
    var p = pt(e), s = hit(pos.st, p, 32);
    if(drag.moved){ if(s >= 0) toggle(drag.c, s); sel = -1; }
    else sel = (sel === drag.c) ? -1 : drag.c;
    drag = null;
  }
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', function(){ drag = null; });
  document.addEventListener('keydown', function(e){
    if(e.key === ' ' && running && document.activeElement && document.activeElement.tagName !== 'BUTTON' && document.activeElement.tagName !== 'INPUT'){
      e.preventDefault(); setPaused(!paused);
    }
  });
  document.addEventListener('visibilitychange', function(){ if(document.hidden && running) setPaused(true); });
  var rT = null;
  window.addEventListener('resize', function(){ clearTimeout(rT); rT = setTimeout(function(){ layout(); }, 80); });

  // ---------- loop ----------
  var last = 0, acc = 0;
  function frame(ts){
    requestAnimationFrame(frame);
    var dt = last ? Math.min(0.05, (ts - last)/1000) : 0; last = ts;
    if(running && !paused){
      acc += dt; var n = 0;
      while(acc >= STEP && n < 6){ CORE.step(S, STEP); acc -= STEP; n++; }
      if(n >= 6) acc = 0;
      handleEvents();
      if(S.status !== 'play'){ hud(); end(); }
    }
    if(!paused){
      for(var i=parts.length-1;i>=0;i--){ parts[i].life -= dt; if(parts[i].life <= 0) parts.splice(i, 1); }
      for(var j=labels.length-1;j>=0;j--){ labels[j].life -= dt*0.9; if(labels[j].life <= 0) labels.splice(j, 1); }
    }
    hudT -= dt; if(hudT <= 0 && S){ hudT = 0.15; hud(); }
    if(toastT > 0){ toastT -= dt; if(toastT <= 0) $('toast').textContent = ''; }
    if(S) draw(ts/1000);
  }

  var start = 0;
  for(var k=0;k<LV.length;k++) if(unlocked(k)) start = k;
  if(cleared.length >= LV.length) start = 0;
  load(start);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
